version: "3"

tasks:
  default:
    desc: List all available infrastructure local workflow tasks
    cmds:
      - task --list

  # --------------------------------------------------------------------------
  # AWS Infrastructure Workflows (.github/workflows/aws-deploy)
  # --------------------------------------------------------------------------
  aws-list:
    desc: List AWS infrastructure workflow jobs
    dir: .github/workflows/aws-deploy
    cmds:
      - task list

  aws-plan-dev:
    desc: Test AWS infrastructure plan for DEV locally
    dir: .github/workflows/aws-deploy
    cmds:
      - task plan-dev

  aws-apply-dev:
    desc: Test full AWS infrastructure pipeline (plan + apply) for DEV locally
    dir: .github/workflows/aws-deploy
    cmds:
      - task apply-dev

  aws-push-dev:
    desc: Test AWS infrastructure push-to-dev event locally
    dir: .github/workflows/aws-deploy
    cmds:
      - task push-dev

  aws-tag-stg:
    desc: Test AWS infrastructure tag release event for STG locally
    dir: .github/workflows/aws-deploy
    cmds:
      - task tag-stg

  aws-tag-prod:
    desc: Test AWS infrastructure tag release event for PROD locally
    dir: .github/workflows/aws-deploy
    cmds:
      - task tag-prod

  # --------------------------------------------------------------------------
  # K8s Infrastructure Workflows (.github/workflows/k8s-deploy)
  # --------------------------------------------------------------------------
  k8s-list:
    desc: List K8s infrastructure workflow jobs
    dir: .github/workflows/k8s-deploy
    cmds:
      - task list

  k8s-plan-dev:
    desc: Test K8s infrastructure plan for DEV locally
    dir: .github/workflows/k8s-deploy
    cmds:
      - task plan-dev

  k8s-apply-dev:
    desc: Test full K8s infrastructure pipeline (plan + apply) for DEV locally
    dir: .github/workflows/k8s-deploy
    cmds:
      - task apply-dev

  k8s-push-dev:
    desc: Test K8s infrastructure push-to-dev event locally
    dir: .github/workflows/k8s-deploy
    cmds:
      - task push-dev

  k8s-tag-stg:
    desc: Test K8s infrastructure tag release event for STG locally
    dir: .github/workflows/k8s-deploy
    cmds:
      - task tag-stg

  k8s-tag-prod:
    desc: Test K8s infrastructure tag release event for PROD locally
    dir: .github/workflows/k8s-deploy
    cmds:
      - task tag-prod

  # --------------------------------------------------------------------------
  # Infrastructure Destruction Workflows (.github/workflows/infra-destroy)
  # --------------------------------------------------------------------------
  destroy-list:
    desc: List Infrastructure teardown workflow jobs
    dir: .github/workflows/infra-destroy
    cmds:
      - task list

  destroy-validate-dev:
    desc: Non-destructive test of validate-and-resolve phase for DEV locally
    dir: .github/workflows/infra-destroy
    cmds:
      - task validate-dev

  destroy-validate-stg:
    desc: Non-destructive test of validate-and-resolve phase for STG locally
    dir: .github/workflows/infra-destroy
    cmds:
      - task validate-stg

  destroy-validate-prod:
    desc: Non-destructive test of validate-and-resolve phase for PROD locally
    dir: .github/workflows/infra-destroy
    cmds:
      - task validate-prod

  destroy-dev-k8s:
    desc: Test K8s teardown for DEV locally
    dir: .github/workflows/infra-destroy
    cmds:
      - task destroy-k8s-dev

  destroy-dev-all:
    desc: Test full teardown pipeline (K8s + AWS) for DEV locally
    dir: .github/workflows/infra-destroy
    cmds:
      - task destroy-all-dev

  # --------------------------------------------------------------------------
  # Frontend Deployment Workflows (.github/workflows/frontend-deploy)
  # --------------------------------------------------------------------------
  frontend-list:
    desc: List Frontend deployment workflow jobs
    dir: .github/workflows/frontend-deploy
    cmds:
      - task list

  frontend-plan-dev:
    desc: Test Frontend build-and-promote for DEV locally
    dir: .github/workflows/frontend-deploy
    cmds:
      - task plan-dev

  frontend-apply-dev:
    desc: Test full Frontend pipeline (build + deploy) for DEV locally
    dir: .github/workflows/frontend-deploy
    cmds:
      - task apply-dev

  frontend-push-dev:
    desc: Test Frontend push-to-dev event locally
    dir: .github/workflows/frontend-deploy
    cmds:
      - task push-dev

  frontend-tag-stg:
    desc: Test Frontend tag release event for STG locally
    dir: .github/workflows/frontend-deploy
    cmds:
      - task tag-stg

  frontend-tag-prod:
    desc: Test Frontend tag release event for PROD locally
    dir: .github/workflows/frontend-deploy
    cmds:
      - task tag-prod
