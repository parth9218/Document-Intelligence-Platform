# Default values for api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

projectName: "docintel"
appName: "worker"
environment: "dev"

container:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  secrets-provider-class: ""
  secrets-object: ""
  parameters-object: ""

# Change to reflect region and account-id
aws:
  region: us-east-1
  accountId: "389642461016"

keda:
  queueLength: "3"
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval:  30
  cooldownPeriod:   300

serviceAccount: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi

env: {}
