# Default values for api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

projectName: "docintel"
appName: "worker"
environment: "dev"

container:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  secrets-provider-class: ""
  secrets-object: ""
  parameters-object: ""

serviceAccount:
  annotations: 
  - eks.amazonaws.com/role-arn: "arn:aws:iam::389642461016:role/docintel-dev-worker-role"

resources:
  requests:
    cpu: 250m
    memory: 256Mi

env: {}
