apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.projectName }}-{{ .Values.appName }}-{{ .Values.environment }}-migration
  labels:
    app: {{ .Values.appName }}
    environment: {{ .Values.environment }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.projectName }}-{{ .Values.environment }}-{{ .Values.appName }}-sa
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ index .Values.container "secrets-provider-class" }}
      containers:
        - name: {{ .Values.appName }}-migration
          image: "{{ .Values.container.image.repository }}:{{ .Values.container.image.tag }}"
          imagePullPolicy: {{ .Values.container.image.pullPolicy }}
          command: ["node", "dist/scripts/migrate.js"]
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          envFrom:
            - secretRef:
                name: {{ index .Values.container "secrets-object" }}
            - secretRef:
                name: {{ index .Values.container "parameters-object" }}
          env:
            - name: NODE_ENV
              value: {{ .Values.environment | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
