apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.projectName }}-{{ .Values.environment }}-{{ .Values.appName }}-httproute
  labels:
    app: {{ .Values.appName }}
    environment: {{ .Values.environment }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httproute.pathPrefix }}
      filters:
        # Strip the /api prefix before forwarding to the backend service.
        # ReplacePrefixMatch replaces only the matched prefix segment:
        #   /api          → /
        #   /api/documents → /documents
        #   /api/query    → /query
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ .Values.projectName }}-{{ .Values.environment }}-{{ .Values.appName }}-service
          port: {{ .Values.service.port }}
