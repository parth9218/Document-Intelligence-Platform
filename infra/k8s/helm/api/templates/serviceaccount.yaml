apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.projectName }}-{{ .Values.environment }}-{{ .Values.appName }}-sa
  labels:
    app: {{ .Values.appName }}
    environment: {{ .Values.environment }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,install,upgrade
    "helm.sh/hook-weight": "-10"
    "argocd.argoproj.io/sync-wave": "-10"
    {{- if .Values.serviceAccount.annotations }}
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
    {{- end }}
