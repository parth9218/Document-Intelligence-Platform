apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-{{ .Values.appName }}-{{ .Values.environment }}-service-account
  labels:
    app: {{ .Values.appName }}
    environment: {{ .Values.environment }}
  {{- if .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
  {{- end }}
