# Default values for api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

projectName: "docintel"
appName: "api"
environment: "dev"

container:
  image:
    repository: ""
    tag: "latest"
    pullPolicy: IfNotPresent
  secrets-provider-class: ""
  secrets-object: ""
  parameters-object: ""

httproute:
  pathPrefix: "/api"
serviceAccount:
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi

service:
  type: ClusterIP
  port: 3000

env:
  PORT: "3000"

gateway:
  name: "docintel-dev-api-gateway"
  namespace: "default"
