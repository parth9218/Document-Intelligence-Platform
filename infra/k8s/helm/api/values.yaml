# Default values for api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

appName: "api"
environment: "dev"

container:
  image:
    repository: "your-account-id.dkr.ecr.your-region.amazonaws.com/docintel/api"
    tag: "latest"
    pullPolicy: IfNotPresent
  secrets-provider-class: ""
  secrets-object: ""
  parameters-object: ""

serviceAccount:
  annotations: {}

service:
  type: ClusterIP
  port: 3000

env:
  PORT: "3000"
