# Staging Environment Values Override
environment: "stg"
replicaCount: 2
container:
  image:
    repository: "793140949744.dkr.ecr.us-east-1.amazonaws.com/docintel/stg/api"
    tag: "1.0.0"
  secrets-provider-class: "docintel-stg-secrets-class"
  secrets-object: "docintel-stg-secrets"
  parameters-object: "docintel-stg-parameters"

gateway:
  name: "docintel-stg-api-gateway"
  namespace: "default"
  listenerName: "https"

env:
  NODE_ENV: "stg"

keda:
  targetValue: 5
  window: 1m
  granularity: 10s
  minReplicaCount: 1
  maxReplicaCount: 5
