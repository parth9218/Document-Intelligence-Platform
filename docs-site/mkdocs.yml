site_name: "AI Document Intelligence Platform"
site_description: "Production-Grade Multi-Tenant Cloud-Native Retrieval-Augmented Generation (RAG) Platform on AWS EKS"
site_author: "Platform Engineering Team"
site_url: "https://parth9218.github.io/Document-Intelligence-Platform/"
repo_url: "https://github.com/parth9218/Document-Intelligence-Platform"
repo_name: "parth9218/Document-Intelligence-Platform"
docs_dir: "docs"

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  favicon: "assets/logo.png"
  logo: "assets/logo.png"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 3
  - attr_list
  - def_list
  - tables

plugins:
  - search
  - mermaid2:
      arguments:
        startOnLoad: true
        theme: 'default'
  - panzoom:
      full_screen: true
      key: "none"
      include_selectors:
        - ".architecture-diagram"

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mermaid.min.js
  - javascripts/mermaid-instant.js

