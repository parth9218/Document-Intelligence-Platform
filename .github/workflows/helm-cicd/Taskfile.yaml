version: "3"

env:
  AWS_ACCESS_KEY_ID:
    sh: aws configure get aws_access_key_id 2>/dev/null || echo ""
  AWS_SECRET_ACCESS_KEY:
    sh: aws configure get aws_secret_access_key 2>/dev/null || echo ""
  AWS_REGION:
    sh: aws configure get region 2>/dev/null || echo "us-east-1"
  TF_PROJECT_NAME:
    sh: echo "${TF_PROJECT_NAME:-docintel}"

tasks:
  list:
    desc: List all available jobs in helm-cicd workflow
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -W .github/workflows/helm-cicd.yml \
          -C ../../.. \
          --list

  lint:
    desc: Lint Helm charts locally
    cmds:
      - echo "Linting API chart..."
      - helm lint ../../../infra/k8s/helm/api
      - echo "Linting Worker chart..."
      - helm lint ../../../infra/k8s/helm/worker

  template:
    desc: Render Helm templates locally with base values.yaml
    cmds:
      - echo "Rendering API chart template..."
      - helm template test-api ../../../infra/k8s/helm/api > /dev/null
      - echo "Rendering Worker chart template..."
      - helm template test-worker ../../../infra/k8s/helm/worker > /dev/null
      - echo "All charts templated successfully!"

  test-push-dev:
    desc: Simulate push to dev branch via act
    cmds:
      - |
        act push \
          -j detect-and-matrix \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/helm-cicd.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var TF_PROJECT_NAME="$TF_PROJECT_NAME" \
          -e ./.github/workflows/helm-cicd/events/push-dev.json

  test-dispatch-dev:
    desc: Simulate workflow_dispatch selecting all charts on dev via act
    cmds:
      - |
        act workflow_dispatch \
          -j detect-and-matrix \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/helm-cicd.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var TF_PROJECT_NAME="$TF_PROJECT_NAME" \
          -e ./.github/workflows/helm-cicd/events/dev-all.json

  test-tag-stg:
    desc: Simulate pushing release tag stg-helm-api-v1.0.0 via act
    cmds:
      - |
        act push \
          -j detect-and-matrix \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/helm-cicd.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var TF_PROJECT_NAME="$TF_PROJECT_NAME" \
          -e ./.github/workflows/helm-cicd/events/tag-stg-api.json

  test-tag-prod:
    desc: Simulate pushing release tag prod-helm-worker-v1.0.0 via act
    cmds:
      - |
        act push \
          -j detect-and-matrix \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/helm-cicd.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var TF_PROJECT_NAME="$TF_PROJECT_NAME" \
          -e ./.github/workflows/helm-cicd/events/tag-prod-worker.json
