version: "3"

env:
  AWS_ACCESS_KEY_ID:
    sh: aws configure get aws_access_key_id
  AWS_SECRET_ACCESS_KEY:
    sh: aws configure get aws_secret_access_key 
  AWS_REGION:
    sh: aws configure get region || echo "us-east-1"
  TF_DB_USERNAME: postgres

tasks:
  list:
    desc: List all available jobs in infra-destroy workflow
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -W .github/workflows/infra-destroy.yml \
          -C ../../.. \
          --list

  # --------------------------------------------------------------------------
  # Non-Destructive Validation & Reference Resolution Checks
  # --------------------------------------------------------------------------
  validate-dev:
    desc: Non-destructive test of validate-and-resolve phase for DEV
    cmds:
      - |
        act workflow_dispatch \
          -j validate-and-resolve \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/infra-destroy.yml \
          -e ./.github/workflows/infra-destroy/events/validate-dev.json

  validate-stg:
    desc: Non-destructive test of validate-and-resolve phase for STG (with release tags)
    cmds:
      - |
        act workflow_dispatch \
          -j validate-and-resolve \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/infra-destroy.yml \
          -e ./.github/workflows/infra-destroy/events/validate-stg.json

  validate-prod:
    desc: Non-destructive test of validate-and-resolve phase for PROD (with release tags)
    cmds:
      - |
        act workflow_dispatch \
          -j validate-and-resolve \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/infra-destroy.yml \
          -e ./.github/workflows/infra-destroy/events/validate-prod.json

  # --------------------------------------------------------------------------
  # Teardown Execution Tasks
  # --------------------------------------------------------------------------
  destroy-k8s-dev:
    desc: Test K8s teardown for DEV environment locally
    cmds:
      - |
        act workflow_dispatch \
          -j destroy-k8s \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/infra-destroy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --secret TF_DB_USERNAME="$TF_DB_USERNAME" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          -e ./.github/workflows/infra-destroy/events/dev-k8s.json

  destroy-all-dev:
    desc: Test full teardown pipeline (K8s + AWS) for DEV environment locally
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/infra-destroy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --secret TF_DB_USERNAME="$TF_DB_USERNAME" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          -e ./.github/workflows/infra-destroy/events/dev-all.json
