# ==============================================================================
# API Service CI/CD Pipeline Workflow
# ==============================================================================
# Purpose:
#   Triggers container image build, push to ECR, and GitOps Helm release updates
#   for the Express/TypeScript Node.js API service (`apps/api`).
#
# Trigger Conditions:
#   - Push to `dev` branch with changes under `apps/api/**`.
#   - Merged pull requests targeting `dev` branch with changes under `apps/api/**`.
#   - Manual `workflow_dispatch`.
#
# Modular Architecture:
#   Delegates execution to the reusable workflow `.github/workflows/reusable-docker-helm-cicd.yml`
#   passing service-specific inputs (`app_name`, `app_path`, `helm_values_path`).
# ==============================================================================

name: API CI/CD Workflow

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/api/**'
  pull_request:
    types: [closed]
    branches:
      - dev
    paths:
      - 'apps/api/**'
  workflow_dispatch:

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: read

jobs:
  deploy-api:
    name: Build & Deploy API Service
    if: ${{ github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-docker-helm-cicd.yml
    with:
      app_name: 'api'
      app_path: './apps/api'
      helm_values_path: 'infra/k8s/helm/api/values.dev.yaml'
    secrets: inherit

