# ==============================================================================
# Reusable Docker Build & Helm GitOps CI/CD Workflow
# ==============================================================================
# Purpose:
#   Shared workflow used by microservice pipelines (`api-cicd.yml`, `worker-cicd.yml`)
#   to build Docker container images, push them to AWS ECR, and delegate GitOps Helm chart
#   value updates to `gitops-commit.yml`.
#
# Inputs:
#   - `app_name`: Target application name (e.g., 'api', 'worker').
#   - `app_path`: Path to application context & Dockerfile (e.g., './apps/api').
#   - `helm_values_path`: Path to Helm values file (e.g., 'infra/k8s/helm/api/values.dev.yaml').
#   - `image_to_deploy`: Optional image variant tag ('full' or 'slim') to output for GitOps release.
#
# Features:
#   - Single Runner VM Execution: Reuses runner environment and local Docker layer cache across variant builds.
#   - ECR Image Deduplication: Checks if an image tag (git short SHA / SHA-slim) already exists in ECR before building.
#   - Docker BuildX & GHA Cache: Accelerates builds using GitHub Actions cache (`cache-from/to: type=gha`).
#   - Global GitOps Serialization: Delegates commit execution to `gitops-commit.yml` which locks commits
#     serially to eliminate race conditions on git refs across concurrent builds.
# ==============================================================================

name: Reusable Docker & Helm CI/CD

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the application (e.g., api, worker)'
        required: true
        type: string
      app_path:
        description: 'Path to the application context (e.g., ./apps/api)'
        required: true
        type: string
      helm_values_path:
        description: 'Path to the Helm values file (e.g., infra/k8s/helm/api/values.dev.yaml)'
        required: true
        type: string
      image_to_deploy:
        description: 'Which image variant to deploy (full or slim)'
        required: false
        type: string
        default: 'full'

jobs:
  # ----------------------------------------------------------------------------
  # Build Container Image & Push to Amazon ECR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (${{ inputs.app_name }})
    runs-on: ubuntu-latest
    outputs:
      ecr_repo_url: ${{ steps.set-outputs.outputs.ecr_repo_url }}
      short_sha: ${{ steps.set-outputs.outputs.short_sha }}
      image_tag: ${{ steps.set-outputs.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache NodeJS & AWS CLI
      # ------------------------------------------------------------------------
      - name: Install NodeJS and AWS CLI for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if [ ! -f /usr/bin/node ] || [ ! -f /usr/bin/npm ]; then
            if [ ! -f /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz ]; then
              echo "Downloading NodeJS to local cache..."
              curl -sL "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz" -o /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz
            fi
            echo "Installing NodeJS from local cache..."
            tar -xJf /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz -C /usr/local --strip-components=1
            ln -sf /usr/local/bin/node /usr/bin/node
            ln -sf /usr/local/bin/npm /usr/bin/npm
            ln -sf /usr/local/bin/npx /usr/bin/npx
          fi
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        if: ${{ !env.ACT }}
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e    # v4.0.1
        with:
          terraform_version: "v1.16.4"  
          terraform_wrapper: false
        
      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Get ECR Repo URL
        id: get-ecr-url
        working-directory: infra/terraform/aws/environments/dev
        run: |
          terraform init
          REPO_URL=$(terraform output -json ecr_repo_urls | jq -r '.[] | select(endswith("/${{ inputs.app_name }}") or endswith("-${{ inputs.app_name }}"))')
          echo "ECR_REPO_URL=$REPO_URL" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 

      - name: Get Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ------------------------------------------------------------------------
      # 1. Build & Push Full Container Image (TAG: ${SHORT_SHA})
      # ------------------------------------------------------------------------
      - name: Check if Full Image Tag Exists in ECR
        id: ecr-check-full
        run: |
          TAG_EXISTS=$(aws ecr describe-images \
            --repository-name "$(echo "${{ env.ECR_REPO_URL }}" | cut -d'/' -f2)" \
            --image-ids imageTag=${{ env.SHORT_SHA }} \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          if [ "$TAG_EXISTS" = "${{ env.SHORT_SHA }}" ]; then
            echo "Image ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }} already exists in ECR. Skipping build and push."
            echo "skip_push=true" >> $GITHUB_OUTPUT
          else
            echo "skip_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Full Docker Image
        if: steps.ecr-check-full.outputs.skip_push == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.app_path }}/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=dev

      # ------------------------------------------------------------------------
      # 2. Build & Push Slim Container Image (TAG: ${SHORT_SHA}-slim) [API Only]
      # ------------------------------------------------------------------------
      - name: Check if Slim Image Tag Exists in ECR
        if: ${{ inputs.app_name == 'api' }}
        id: ecr-check-slim
        run: |
          TAG_EXISTS=$(aws ecr describe-images \
            --repository-name "$(echo "${{ env.ECR_REPO_URL }}" | cut -d'/' -f2)" \
            --image-ids imageTag=${{ env.SHORT_SHA }}-slim \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          if [ "$TAG_EXISTS" = "${{ env.SHORT_SHA }}-slim" ]; then
            echo "Image ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }}-slim already exists in ECR. Skipping build and push."
            echo "skip_push=true" >> $GITHUB_OUTPUT
          else
            echo "skip_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Slim Docker Image
        if: ${{ inputs.app_name == 'api' && steps.ecr-check-slim.outputs.skip_push == 'false' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.app_path }}/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }}-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=prod

      - name: Set Outputs
        id: set-outputs
        run: |
          echo "ecr_repo_url=${{ env.ECR_REPO_URL }}" >> $GITHUB_OUTPUT
          echo "short_sha=${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.image_to_deploy }}" = "slim" ]; then
            echo "image_tag=${{ env.SHORT_SHA }}-slim" >> $GITHUB_OUTPUT
          else
            echo "image_tag=${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT
          fi

  # ----------------------------------------------------------------------------
  # Phase 2: Delegate GitOps Commit Execution
  # ----------------------------------------------------------------------------
  # Calls the dedicated GitOps commit workflow as a nested reusable job.
  # The concurrency group inside gitops-commit.yml is a global string that
  # serializes this job across ALL service workflow invocations — api, worker,
  # or any future service — without throttling any build/push work above.
  gitops:
    name: Execute GitOps Commit
    needs: build-and-push
    uses: ./.github/workflows/gitops-commit.yml
    with:
      app_name: ${{ inputs.app_name }}
      helm_values_path: ${{ inputs.helm_values_path }}
      ecr_repo_url: ${{ needs.build-and-push.outputs.ecr_repo_url }}
      short_sha: ${{ needs.build-and-push.outputs.short_sha }}
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
    secrets: inherit

