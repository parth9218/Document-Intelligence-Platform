name: Reusable Docker & Helm CI/CD

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the application (e.g., api, worker)'
        required: true
        type: string
      app_path:
        description: 'Path to the application context (e.g., ./apps/api)'
        required: true
        type: string
      helm_values_path:
        description: 'Path to the Helm values file (e.g., infra/k8s/helm/api/values.dev.yaml)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      ecr_repo_url: ${{ steps.set-outputs.outputs.ecr_repo_url }}
      short_sha: ${{ steps.set-outputs.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Get ECR Repo URL
        id: get-ecr-url
        working-directory: infra/terraform/aws/environments/dev
        run: |
          terraform init
          REPO_URL=$(terraform output -json ecr_repo_urls | jq -r '.[] | select(endswith("-${{ inputs.app_name }}"))')
          echo "ECR_REPO_URL=$REPO_URL" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Check if Image Tag Already Exists in ECR
        id: ecr-check
        run: |
          TAG_EXISTS=$(aws ecr describe-images \
            --repository-name "$(echo "${{ env.ECR_REPO_URL }}" | cut -d'/' -f2)" \
            --image-ids imageTag=${{ env.SHORT_SHA }} \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")
          if [ "$TAG_EXISTS" = "${{ env.SHORT_SHA }}" ]; then
            echo "Image ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }} already exists in ECR. Skipping build and push."
            echo "skip_push=true" >> $GITHUB_OUTPUT
          else
            echo "skip_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        if: steps.ecr-check.outputs.skip_push == 'false'
        uses: docker/build-push-action@v4
        with:
          context: ${{ inputs.app_path }}
          file: ${{ inputs.app_path }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REPO_URL }}:${{ env.SHORT_SHA }}
          build-args: |
            ENVIRONMENT=dev

      - name: Set Outputs
        id: set-outputs
        run: |
          echo "ecr_repo_url=${{ env.ECR_REPO_URL }}" >> $GITHUB_OUTPUT
          echo "short_sha=${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT

  # Calls the dedicated GitOps commit workflow as a nested reusable job.
  # The concurrency group inside gitops-commit.yml is a global string that
  # serializes this job across ALL service workflow invocations — api, worker,
  # or any future service — without throttling any build/push work above.
  gitops:
    needs: build-and-push
    uses: ./.github/workflows/gitops-commit.yml
    with:
      app_name: ${{ inputs.app_name }}
      helm_values_path: ${{ inputs.helm_values_path }}
      ecr_repo_url: ${{ needs.build-and-push.outputs.ecr_repo_url }}
      short_sha: ${{ needs.build-and-push.outputs.short_sha }}
    secrets: inherit
