# ==============================================================================
# Frontend Static Asset Deployment Workflow
# ==============================================================================
# Purpose:
#   Implements a multi-environment, tag-driven CI/CD deployment pipeline for the
#   Next.js React frontend application (`apps/frontend`).
#
# Architectural Principles:
#   - Build Once, Promote Anywhere: Compiles source code once in `dev`, packages
#     and uploads immutable build archive to a shared S3 artifact bucket (`vars.ARTIFACT_BUCKET_NAME`).
#   - Promotion to `stg` and `prod`: Verifies and promotes immutable release tarballs without rebuilding.
#   - Approval Gate Before Publishing: Builds/promotes artifacts first, then pauses for manual approval
#     on `stg` and `prod` before deploying static assets to the environment S3 bucket.
#   - Decoupled Runtime Configuration: Injects environment-specific `config.js` at deploy time.
#   - Edge Caching & Browser Revalidation: Static hashed chunks cached permanently, `config.js`
#     edge-cached with `public, max-age=0, s-maxage=86400, must-revalidate`.
#   - Selective Audit Tracking: Tagged releases selectively update `{env}/app` tracking branches.
# ==============================================================================

name: Deploy Frontend Static Assets

on:
  push:
    branches:
      - dev
    paths:
      - 'apps/frontend/**'
    tags:
      - 'stg-frontend-v*'
      - 'prod-frontend-v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: write # Required for selective release tracking branch commits

jobs:
  # ----------------------------------------------------------------------------
  # Phase 0: Target Environment & Version Resolution
  # ----------------------------------------------------------------------------
  detect-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      version: ${{ steps.resolve.outputs.version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Parse Environment & Release Metadata
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TARGET_ENV=$(echo "$TAG_NAME" | cut -d'-' -f1)
            VERSION=$(echo "$TAG_NAME" | sed -E 's/^[a-z]+-frontend-//')
          elif [[ ("${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "dev") || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="dev"
            VERSION="0.0.0"
          else
            TARGET_ENV="dev"
            VERSION="0.0.0"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SHA="${{ github.sha }}"

          echo "Target Environment: $TARGET_ENV"
          echo "Target Version: $VERSION"
          echo "Commit SHA: $COMMIT_SHA"

          echo "env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # Phase 1: Build & Promote Artifacts (Pre-Deployment)
  # ----------------------------------------------------------------------------
  build-and-promote:
    name: Build & Promote Artifacts
    needs: detect-env
    runs-on: ubuntu-latest
    env:
      ENV: ${{ needs.detect-env.outputs.env }}
      VERSION: ${{ needs.detect-env.outputs.version }}
      SHORT_SHA: ${{ needs.detect-env.outputs.short_sha }}
      COMMIT_SHA: ${{ needs.detect-env.outputs.commit_sha }}
      ARTIFACT_BUCKET_NAME: ${{ vars.ARTIFACT_BUCKET_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache NodeJS & AWS CLI
      # ------------------------------------------------------------------------
      - name: Install NodeJS and AWS CLI for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if [ ! -f /usr/bin/node ] || [ ! -f /usr/bin/npm ]; then
            if [ ! -f /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz ]; then
              echo "Downloading NodeJS to local cache..."
              curl -sL "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz" -o /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz
            fi
            echo "Installing NodeJS from local cache..."
            tar -xJf /tmp/.act-tools-cache/node-v22.14.0-linux-x64.tar.xz -C /usr/local --strip-components=1
            ln -sf /usr/local/bin/node /usr/bin/node
            ln -sf /usr/local/bin/npm /usr/bin/npm
            ln -sf /usr/local/bin/npx /usr/bin/npx
          fi
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Install Node.js (Dev Environment Only for Build)
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        if: ${{ !env.ACT && needs.detect-env.outputs.env == 'dev' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      # ------------------------------------------------------------------------
      # Dev Environment: Compile, Package & Store Build Artifact
      # ------------------------------------------------------------------------
      - name: Build and Upload Dev Artifact
        if: ${{ needs.detect-env.outputs.env == 'dev' }}
        run: |
          if [ -z "$ARTIFACT_BUCKET_NAME" ]; then
            echo "::error::Repository variable ARTIFACT_BUCKET_NAME is not set!"
            exit 1
          fi

          echo "Building frontend bundle for dev environment..."
          cd apps/frontend
          npm ci
          npm run build
          cd ../..

          echo "Packaging build artifact..."
          mkdir -p /tmp/artifacts
          tar -czf "/tmp/artifacts/frontend-${COMMIT_SHA}.tar.gz" -C apps/frontend/out .

          echo "Uploading build artifact to s3://${ARTIFACT_BUCKET_NAME}/builds/${COMMIT_SHA}.tar.gz..."
          aws s3 cp "/tmp/artifacts/frontend-${COMMIT_SHA}.tar.gz" \
            "s3://${ARTIFACT_BUCKET_NAME}/builds/${COMMIT_SHA}.tar.gz"
          echo "✅ Dev artifact stored at s3://${ARTIFACT_BUCKET_NAME}/builds/${COMMIT_SHA}.tar.gz"

      # ------------------------------------------------------------------------
      # Staging & Production: Verify & Promote Release Artifact
      # ------------------------------------------------------------------------
      - name: Promote Release Artifact
        if: ${{ needs.detect-env.outputs.env != 'dev' }}
        run: |
          if [ -z "$ARTIFACT_BUCKET_NAME" ]; then
            echo "::error::Repository variable ARTIFACT_BUCKET_NAME is not set!"
            exit 1
          fi

          if [ "$ENV" == "stg" ]; then
            SOURCE_KEY="builds/${COMMIT_SHA}.tar.gz"
            DEST_KEY="releases/stg/${VERSION}.tar.gz"
            SOURCE_DESC="dev build for commit ${COMMIT_SHA} (s3://${ARTIFACT_BUCKET_NAME}/${SOURCE_KEY})"
          elif [ "$ENV" == "prod" ]; then
            SOURCE_KEY="releases/stg/${VERSION}.tar.gz"
            DEST_KEY="releases/prod/${VERSION}.tar.gz"
            SOURCE_DESC="staging release for version ${VERSION} (s3://${ARTIFACT_BUCKET_NAME}/${SOURCE_KEY})"
          fi

          echo "Verifying prerequisite artifact exists..."
          if ! aws s3 ls "s3://${ARTIFACT_BUCKET_NAME}/${SOURCE_KEY}" > /dev/null 2>&1; then
            echo "::error::Prerequisite artifact does not exist: ${SOURCE_DESC}."
            echo "::error::Deploy to the preceding environment before promoting to ${ENV}!"
            exit 1
          fi

          echo "Promoting artifact: s3://${ARTIFACT_BUCKET_NAME}/${SOURCE_KEY} -> s3://${ARTIFACT_BUCKET_NAME}/${DEST_KEY}..."
          aws s3 cp "s3://${ARTIFACT_BUCKET_NAME}/${SOURCE_KEY}" "s3://${ARTIFACT_BUCKET_NAME}/${DEST_KEY}"
          echo "✅ Successfully promoted artifact to s3://${ARTIFACT_BUCKET_NAME}/${DEST_KEY}"

  # ----------------------------------------------------------------------------
  # Phase 2: Deploy Static Assets to Environment S3 Bucket
  # ----------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Static Frontend (${{ needs.detect-env.outputs.env }})
    needs: [detect-env, build-and-promote]
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-env.outputs.env }}
    concurrency:
      group: git-commit-${{ needs.detect-env.outputs.env == 'dev' && 'dev' || format('{0}-app', needs.detect-env.outputs.env) }}
      cancel-in-progress: false
    env:
      ENV: ${{ needs.detect-env.outputs.env }}
      VERSION: ${{ needs.detect-env.outputs.version }}
      SHORT_SHA: ${{ needs.detect-env.outputs.short_sha }}
      COMMIT_SHA: ${{ needs.detect-env.outputs.commit_sha }}
      ARTIFACT_BUCKET_NAME: ${{ vars.ARTIFACT_BUCKET_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache AWS CLI
      # ------------------------------------------------------------------------
      - name: Install AWS CLI for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Terraform Query Module Setup
      # ------------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # ------------------------------------------------------------------------
      # Retrieve Infrastructure Outputs (S3 Bucket ID & CloudFront Domain)
      # ------------------------------------------------------------------------
      - name: Query Infrastructure Outputs via query Module
        id: query-outputs
        working-directory: infra/terraform/query
        run: |
          terraform init -lockfile=readonly
          AWS_CONFIG="../aws/environments/${{ env.ENV }}/backend.config.hcl"

          if [ ! -f "$AWS_CONFIG" ]; then
            echo "::error::AWS backend config not found at $AWS_CONFIG."
            exit 1
          fi

          if ! terraform apply -auto-approve -input=false -var-file="$AWS_CONFIG"; then
            echo "::error::Prerequisite AWS infrastructure remote state not found or inaccessible for environment '${{ env.ENV }}'."
            echo "::error::Deploy ${{ env.ENV }}-infra-aws-v* before deploying frontend assets!"
            exit 1
          fi

          TF_JSON=$(terraform output -json outputs 2>/dev/null || echo "{}")

          FRONTEND_BUCKET=$(echo "$TF_JSON" | jq -r '.frontend_bucket_id // empty')
          CF_DOMAIN=$(echo "$TF_JSON" | jq -r '.cloudfront_domain // empty')
          CF_DIST_ID=$(echo "$TF_JSON" | jq -r '.cloudfront_distribution_id // empty')

          if [ -z "$FRONTEND_BUCKET" ] || [ -z "$CF_DOMAIN" ]; then
            echo "::error::Required frontend outputs (frontend_bucket_id, cloudfront_domain) are missing from ${{ env.ENV }} AWS state!"
            exit 1
          fi

          echo "frontend_bucket_id=$FRONTEND_BUCKET" >> $GITHUB_OUTPUT
          echo "cloudfront_domain=$CF_DOMAIN" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$CF_DIST_ID" >> $GITHUB_OUTPUT
          echo "✅ Infrastructure outputs resolved for ${{ env.ENV }}: Bucket=$FRONTEND_BUCKET, Domain=$CF_DOMAIN, DistID=$CF_DIST_ID"

      # ------------------------------------------------------------------------
      # Download & Unpack Deployed Artifact
      # ------------------------------------------------------------------------
      - name: Download Application Artifact
        run: |
          if [ -z "$ARTIFACT_BUCKET_NAME" ]; then
            echo "::error::Repository variable ARTIFACT_BUCKET_NAME is not set!"
            exit 1
          fi

          if [ "$ENV" == "dev" ]; then
            ARTIFACT_KEY="builds/${COMMIT_SHA}.tar.gz"
          else
            ARTIFACT_KEY="releases/${ENV}/${VERSION}.tar.gz"
          fi

          echo "Fetching artifact from s3://${ARTIFACT_BUCKET_NAME}/${ARTIFACT_KEY}..."
          mkdir -p /tmp/artifacts apps/frontend/out
          aws s3 cp "s3://${ARTIFACT_BUCKET_NAME}/${ARTIFACT_KEY}" /tmp/artifacts/frontend.tar.gz

          echo "Unpacking artifact into apps/frontend/out..."
          tar -xzf /tmp/artifacts/frontend.tar.gz -C apps/frontend/out
          echo "✅ Artifact successfully extracted."

      # ------------------------------------------------------------------------
      # Runtime Configuration Injection (config.js)
      # ------------------------------------------------------------------------
      - name: Inject Runtime Configuration (config.js)
        env:
          CLOUDFRONT_DOMAIN: ${{ steps.query-outputs.outputs.cloudfront_domain }}
        run: |
          echo "Generating runtime configuration for ${{ env.ENV }}..."
          TARGET_MODE="api"
          if [ "${{ env.ENV }}" == "dev" ]; then
            TARGET_MODE="hybrid"
          fi

          cat <<EOF > apps/frontend/out/config.js
          window.__APP_CONFIG__ = {
            API_URL: "https://${CLOUDFRONT_DOMAIN}/api",
            API_MODE: "${TARGET_MODE}",
            APP_VERSION: "${{ env.VERSION }}"
          };
          EOF
          echo "✅ config.js generated with API_URL=https://${CLOUDFRONT_DOMAIN}/api, API_MODE=${TARGET_MODE}, APP_VERSION=${{ env.VERSION }}"
          cat apps/frontend/out/config.js

      # ------------------------------------------------------------------------
      # Synchronize Static Assets to S3 Frontend Bucket
      # ------------------------------------------------------------------------
      - name: Synchronize Assets to S3 Frontend Bucket
        env:
          FRONTEND_BUCKET_ID: ${{ steps.query-outputs.outputs.frontend_bucket_id }}
        run: |
          echo "Syncing static assets to s3://${FRONTEND_BUCKET_ID} (excluding config.js)..."
          aws s3 sync apps/frontend/out "s3://${FRONTEND_BUCKET_ID}" \
            --delete \
            --exclude "config.js"

          echo "Uploading runtime config.js with revalidation headers..."
          aws s3 cp apps/frontend/out/config.js "s3://${FRONTEND_BUCKET_ID}/config.js" \
            --content-type "application/javascript" \
            --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      # ------------------------------------------------------------------------
      # Invalidate CloudFront CDN Cache
      # ------------------------------------------------------------------------
      - name: Invalidate CloudFront Cache
        env:
          CLOUDFRONT_DIST_ID: ${{ steps.query-outputs.outputs.cloudfront_distribution_id }}
        run: |
          if [ -n "$CLOUDFRONT_DIST_ID" ] && [ "$CLOUDFRONT_DIST_ID" != "None" ]; then
            echo "Creating CloudFront cache invalidation for distribution: $CLOUDFRONT_DIST_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$CLOUDFRONT_DIST_ID" \
              --paths "/*"
          else
            echo "CloudFront distribution ID not set or None. Skipping invalidation."
          fi

      # ------------------------------------------------------------------------
      # Selective Release Branch Tracking (Executed only on release tags)
      # ------------------------------------------------------------------------
      - name: Update Selective Release Tracking Branch
        if: ${{ github.ref_type == 'tag' }}
        run: |
          TARGET_BRANCH="${{ env.ENV }}/app"
          echo "Updating release tracking branch: $TARGET_BRANCH"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git checkout "$TARGET_BRANCH"
            git pull --rebase origin "$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi

          echo "Selectively checking out apps/frontend from tag ${{ github.ref_name }}..."
          git checkout "${{ github.ref_name }}" -- "apps/frontend" 2>/dev/null || \
          git checkout "tags/${{ github.ref_name }}" -- "apps/frontend" 2>/dev/null || true

          if [ -d "apps/frontend" ]; then
            git add "apps/frontend"
          fi

          git commit -m "release(frontend): deploy frontend ${{ env.VERSION }} [skip ci]" \
                     -m "Release Tag: ${{ github.ref_name }}" \
                     -m "Source Commit: ${{ env.COMMIT_SHA }}" \
                     -m "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "No changes to commit"

          git pull --rebase origin "$TARGET_BRANCH" || true
          git push origin HEAD:"$TARGET_BRANCH"
          echo "Successfully pushed release commit to $TARGET_BRANCH."

      # ------------------------------------------------------------------------
      # Generate GitHub Deployment Step Summary
      # ------------------------------------------------------------------------
      - name: Generate GitHub Deployment Summary
        if: always()
        run: |
          echo "## 🌐 Frontend Static Asset Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "### Status: ✅ Successful Deployment" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Status: ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📌 Deployment Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "| **Release Tag** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Release Tracking Branch** | \`${{ env.ENV }}/app\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| **Version** | \`${{ env.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ env.COMMIT_SHA }}\` (\`${{ env.SHORT_SHA }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend S3 Bucket** | \`${{ steps.query-outputs.outputs.frontend_bucket_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFront Domain** | \`https://${{ steps.query-outputs.outputs.cloudfront_domain }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFront Invalidation** | \`${{ steps.query-outputs.outputs.cloudfront_distribution_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> **Consolidated Tracking Branch:** Frontend releases to staging and production are selectively committed to \`${{ env.ENV }}/app\` without wiping sibling microservices." >> $GITHUB_STEP_SUMMARY
