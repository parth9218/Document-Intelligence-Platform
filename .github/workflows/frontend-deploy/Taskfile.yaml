version: "3"

env:
  AWS_ACCESS_KEY_ID:
    sh: aws configure get aws_access_key_id
  AWS_SECRET_ACCESS_KEY:
    sh: aws configure get aws_secret_access_key 
  AWS_REGION:
    sh: aws configure get region || echo "us-east-1"
  ARTIFACT_BUCKET_NAME:
    sh: echo "${ARTIFACT_BUCKET_NAME:-docintel-frontend-artifacts}"

tasks:
  list:
    desc: List all available jobs in frontend-deploy workflow
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -W .github/workflows/frontend-deploy.yml \
          -C ../../.. \
          --list

  # --------------------------------------------------------------------------
  # Development Environment (workflow_dispatch & push)
  # --------------------------------------------------------------------------
  detect-dev:
    desc: Run detect-env job for DEV environment via workflow_dispatch
    cmds:
      - |
        act workflow_dispatch \
          -j detect-env \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          -e ./.github/workflows/frontend-deploy/events/dev.json

  build-dev:
    desc: Run build-and-promote job for DEV environment (compile & upload to S3)
    cmds:
      - |
        act workflow_dispatch \
          -j build-and-promote \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/dev.json

  deploy-dev:
    desc: Run full frontend-deploy pipeline for DEV environment
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/dev.json

  push-dev:
    desc: Simulate git push to dev branch triggering frontend-deploy
    cmds:
      - |
        act push \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/push-dev.json

  # --------------------------------------------------------------------------
  # Staging Environment (tag trigger)
  # --------------------------------------------------------------------------
  promote-stg:
    desc: Run build-and-promote job for STG release tag
    cmds:
      - |
        act push \
          -j build-and-promote \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/tag-stg.json

  tag-stg:
    desc: Simulate pushing release tag stg-frontend-v1.0.0
    cmds:
      - |
        act push \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/tag-stg.json

  # --------------------------------------------------------------------------
  # Production Environment (tag trigger)
  # --------------------------------------------------------------------------
  promote-prod:
    desc: Run build-and-promote job for PROD release tag
    cmds:
      - |
        act push \
          -j build-and-promote \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/tag-prod.json

  tag-prod:
    desc: Simulate pushing release tag prod-frontend-v1.0.0
    cmds:
      - |
        act push \
          --container-architecture linux/amd64 \
          -P ubuntu-latest=catthehacker/ubuntu:act-latest \
          -C ../../.. \
          -W .github/workflows/frontend-deploy.yml \
          --container-options "-v $HOME/.terraform.d/plugin-cache:/tmp/.terraform.d/plugin-cache -v $HOME/.cache/act-tools:/tmp/.act-tools-cache --memory=4g" \
          --secret AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --secret AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
          --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
          --env AWS_REGION="$AWS_REGION" \
          --var ARTIFACT_BUCKET_NAME="$ARTIFACT_BUCKET_NAME" \
          -e ./.github/workflows/frontend-deploy/events/tag-prod.json
