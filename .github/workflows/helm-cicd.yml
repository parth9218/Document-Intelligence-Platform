# ==============================================================================
# Helm Chart Multi-Environment CI/CD Pipeline Workflow
# ==============================================================================
# Purpose:
#   Implements a strict "Package once in dev, promote identical immutable artifacts
#   to stg/prod" CI/CD pipeline for Helm charts using Amazon ECR OCI registries.
#
# Architectural Lifecycle:
#   1. Dev: Runs helm lint & template verification, packages chart with dynamic
#      version `0.0.0-${SHORT_SHA}` (without modifying Chart.yaml on disk),
#      and pushes OCI package to the dev ECR repository queried from infrastructure.
#   2. Staging: Tag `{stg}-helm-{app}-v{semver}` triggers workflow. Queries
#      infrastructure for dev and stg ECR repository URLs (fails if not found).
#      Verifies that `0.0.0-${SHORT_SHA}` exists in dev ECR (fails if missing).
#      Pulls the chart from dev ECR, unpacks and repackages it with `--version {semver}`
#      (without touching Git files on disk), and pushes to stg ECR repository.
#   3. Production: Tag `{prod}-helm-{app}-v{semver}` triggers workflow. Queries
#      infrastructure for stg and prod ECR repository URLs (fails if not found).
#      Verifies that `{semver}` exists in stg ECR (fails if missing).
#      Pulls the exact immutable `{semver}` archive from stg ECR and pushes directly
#      to prod ECR repository with zero rebuilding.
#   4. GitOps Commit: Serialized downstream job pauses at GitHub Environment approval
#      gate (stg/prod), updates discovery configuration pointer
#      `infra/k8s/argocd/${env}/helm-${app}/config.json`, and commits/pushes to the
#      respective tracking branch (`dev` or `{env}/helm`) with a rebase loop.
# ==============================================================================

name: Helm Chart CI/CD Pipeline

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/k8s/helm/**'
    tags:
      - 'stg-helm-api-v*'
      - 'stg-helm-worker-v*'
      - 'prod-helm-api-v*'
      - 'prod-helm-worker-v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'Select chart to package and deploy (dev only)'
        required: true
        type: choice
        options:
          - 'all'
          - 'api'
          - 'worker'
        default: 'all'

permissions:
  id-token: write
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # Phase 1: Environment, Version & Target Matrix Resolution
  # ----------------------------------------------------------------------------
  detect-and-matrix:
    name: Resolve Release Metadata & Matrix
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
      lower_env: ${{ steps.resolve.outputs.lower_env }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      target_version: ${{ steps.resolve.outputs.target_version }}
      lower_version: ${{ steps.resolve.outputs.lower_version }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve Environment & Matrix Targets
        id: resolve
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SHA="${{ github.sha }}"

          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TARGET_ENV=$(echo "$TAG_NAME" | cut -d'-' -f1)
            APP=$(echo "$TAG_NAME" | cut -d'-' -f3)
            SEMVER=$(echo "$TAG_NAME" | sed -E 's/^[a-z]+-helm-[a-z]+-v//')
            MATRIX="[\"$APP\"]"

            TARGET_VERSION="$SEMVER"
            if [ "$TARGET_ENV" = "stg" ]; then
              LOWER_ENV="dev"
              LOWER_VERSION="0.0.0-${SHORT_SHA}"
            elif [ "$TARGET_ENV" = "prod" ]; then
              LOWER_ENV="stg"
              LOWER_VERSION="$SEMVER"
            else
              LOWER_ENV=""
              LOWER_VERSION=""
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="dev"
            LOWER_ENV=""
            TARGET_VERSION="0.0.0-${SHORT_SHA}"
            LOWER_VERSION=""
            if [[ "${{ inputs.app }}" == "api" ]]; then
              MATRIX="[\"api\"]"
            elif [[ "${{ inputs.app }}" == "worker" ]]; then
              MATRIX="[\"worker\"]"
            else
              MATRIX="[\"api\", \"worker\"]"
            fi
          else
            TARGET_ENV="dev"
            LOWER_ENV=""
            TARGET_VERSION="0.0.0-${SHORT_SHA}"
            LOWER_VERSION=""

            # Detect changed chart directories between HEAD~1 and HEAD
            API_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^infra/k8s/helm/api/' || true)
            WORKER_CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E '^infra/k8s/helm/worker/' || true)

            if [[ -n "$API_CHANGED" && -z "$WORKER_CHANGED" ]]; then
              MATRIX="[\"api\"]"
            elif [[ -z "$API_CHANGED" && -n "$WORKER_CHANGED" ]]; then
              MATRIX="[\"worker\"]"
            else
              MATRIX="[\"api\", \"worker\"]"
            fi
          fi

          echo "Target Environment: $TARGET_ENV"
          echo "Lower Environment: $LOWER_ENV"
          echo "Target Version: $TARGET_VERSION"
          echo "Lower Version: $LOWER_VERSION"
          echo "Commit SHA: $COMMIT_SHA"
          echo "App Matrix: $MATRIX"

          echo "env=$TARGET_ENV" >> $GITHUB_OUTPUT
          echo "lower_env=$LOWER_ENV" >> $GITHUB_OUTPUT
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "lower_version=$LOWER_VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # Phase 2: Package Once in Dev / Promote Immutable Artifacts to Stg & Prod
  # ----------------------------------------------------------------------------
  package-or-promote:
    name: Package or Promote Chart (${{ matrix.app }})
    needs: detect-and-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.detect-and-matrix.outputs.matrix) }}
      fail-fast: true
    env:
      ENV: ${{ needs.detect-and-matrix.outputs.env }}
      LOWER_ENV: ${{ needs.detect-and-matrix.outputs.lower_env }}
      TARGET_VERSION: ${{ needs.detect-and-matrix.outputs.target_version }}
      LOWER_VERSION: ${{ needs.detect-and-matrix.outputs.lower_version }}
      APP: ${{ matrix.app }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache Tools
      # ------------------------------------------------------------------------
      - name: Install Tools for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          if ! command -v helm &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/helm-v3.16.4-linux-amd64.tar.gz ]; then
              echo "Downloading Helm to local cache..."
              curl -sL "https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz" -o /tmp/.act-tools-cache/helm-v3.16.4-linux-amd64.tar.gz
            fi
            tar -xzf /tmp/.act-tools-cache/helm-v3.16.4-linux-amd64.tar.gz -C /tmp
            mv /tmp/linux-amd64/helm /usr/local/bin/helm
            chmod +x /usr/local/bin/helm
          fi
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Setup Helm
        if: ${{ !env.ACT }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.3.0'

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use Terraform Plugin Cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # ------------------------------------------------------------------------
      # Query Infrastructure for ECR Repo URLs (Target & Lower Environments)
      # ------------------------------------------------------------------------
      - name: Query Infrastructure for ECR Repository URLs
        id: ecr-query
        working-directory: infra/terraform/query
        run: |
          terraform init -lockfile=readonly

          query_ecr_repo() {
            local q_env="$1"
            local q_app="$2"
            local backend_file="../aws/environments/${q_env}/backend.config.hcl"

            if [ ! -f "$backend_file" ]; then
              echo "::error::Backend config file for environment '${q_env}' not found at: ${backend_file}"
              exit 1
            fi

            if ! terraform apply -auto-approve -input=false -var-file="$backend_file" >/dev/null 2>&1; then
              echo "::error::Failed to query infrastructure state for environment '${q_env}'. Ensure '${q_env}' AWS infrastructure is deployed!"
              exit 1
            fi

            local tf_outputs
            tf_outputs=$(terraform output -json outputs 2>/dev/null || echo "{}")
            local repo_url
            repo_url=$(echo "$tf_outputs" | jq -r --arg app "$q_app" '.ecr_repo_urls[]? | select(endswith("/" + $app))')

            if [ -z "$repo_url" ]; then
              echo "::error::ECR repository URL for app '${q_app}' not found in '${q_env}' infrastructure state outputs!"
              exit 1
            fi

            echo "$repo_url"
          }

          # 1. Query Target Environment ECR Repo URL
          TARGET_REPO_URL=$(query_ecr_repo "${{ env.ENV }}" "${{ env.APP }}")
          REGISTRY_DOMAIN=$(echo "$TARGET_REPO_URL" | cut -d'/' -f1)
          TARGET_OCI_BASE=$(echo "$TARGET_REPO_URL" | sed 's|/[^/]*$||')

          echo "target_repo_url=$TARGET_REPO_URL" >> $GITHUB_OUTPUT
          echo "registry_domain=$REGISTRY_DOMAIN" >> $GITHUB_OUTPUT
          echo "target_oci_base=$TARGET_OCI_BASE" >> $GITHUB_OUTPUT
          echo "Resolved Target ECR Repo: $TARGET_REPO_URL (Registry: $REGISTRY_DOMAIN)"

          # 2. Query Lower Environment ECR Repo URL (for stg and prod)
          if [ -n "${{ env.LOWER_ENV }}" ]; then
            LOWER_REPO_URL=$(query_ecr_repo "${{ env.LOWER_ENV }}" "${{ env.APP }}")
            echo "lower_repo_url=$LOWER_REPO_URL" >> $GITHUB_OUTPUT
            echo "Resolved Lower ECR Repo: $LOWER_REPO_URL"
          fi

      - name: Login to Amazon ECR OCI Registry
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION || 'us-east-1' }} | \
            helm registry login --username AWS --password-stdin "${{ steps.ecr-query.outputs.registry_domain }}"

      # ------------------------------------------------------------------------
      # Dev Environment (env == 'dev') — Package Once
      # ------------------------------------------------------------------------
      - name: Lint, Package & Push Chart to Dev ECR
        if: ${{ env.ENV == 'dev' }}
        run: |
          echo "==> Linting Helm chart: infra/k8s/helm/${{ env.APP }}"
          helm lint "infra/k8s/helm/${{ env.APP }}"

          echo "==> Verifying template rendering with base values.yaml..."
          helm template test-release "infra/k8s/helm/${{ env.APP }}" > /dev/null

          mkdir -p /tmp/charts
          echo "==> Packaging Helm chart with version: ${{ env.TARGET_VERSION }}"
          helm package "infra/k8s/helm/${{ env.APP }}" --version "${{ env.TARGET_VERSION }}" --destination /tmp/charts

          TARGET_OCI="oci://${{ steps.ecr-query.outputs.target_oci_base }}"
          echo "==> Pushing chart archive to Dev ECR: $TARGET_OCI"
          helm push "/tmp/charts/${{ env.APP }}-${{ env.TARGET_VERSION }}.tgz" "$TARGET_OCI"

      # ------------------------------------------------------------------------
      # Higher Environments (stg and prod) — Verify & Copy Artifact
      # ------------------------------------------------------------------------
      - name: Verify in Lower ECR and Promote to Target ECR
        if: ${{ env.ENV != 'dev' }}
        run: |
          LOWER_REPO_URL="${{ steps.ecr-query.outputs.lower_repo_url }}"
          LOWER_REPO_NAME=$(echo "$LOWER_REPO_URL" | cut -d'/' -f2-)
          TARGET_OCI_BASE="${{ steps.ecr-query.outputs.target_oci_base }}"
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"

          echo "==> Verifying chart existence in lower ECR repository: ${LOWER_REPO_NAME} (tag: ${{ env.LOWER_VERSION }})..."
          TAG_EXISTS=$(aws ecr describe-images \
            --region "${REGION}" \
            --repository-name "${LOWER_REPO_NAME}" \
            --image-ids imageTag="${{ env.LOWER_VERSION }}" \
            --query 'imageDetails[0].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          if [ "$TAG_EXISTS" != "${{ env.LOWER_VERSION }}" ]; then
            echo "::error::Chart ${{ env.APP }}:${{ env.LOWER_VERSION }} not found in lower ECR repository (${LOWER_REPO_NAME}). You must release to ${{ env.LOWER_ENV }} first!"
            exit 1
          fi

          echo "==> Artifact verified in lower ECR! Pulling archive..."
          mkdir -p /tmp/charts
          helm pull "oci://${LOWER_REPO_URL}" \
            --version "${{ env.LOWER_VERSION }}" \
            --destination /tmp/charts

          if [ "${{ env.ENV }}" = "stg" ]; then
            # Dev -> Stg: Re-tag OCI package with release semver version
            echo "==> Unpacking dev chart archive and re-packaging with semantic version ${{ env.TARGET_VERSION }}..."
            mkdir -p /tmp/unpacked
            tar -xzf "/tmp/charts/${{ env.APP }}-${{ env.LOWER_VERSION }}.tgz" -C /tmp/unpacked
            mkdir -p /tmp/stg-charts
            helm package "/tmp/unpacked/${{ env.APP }}" --version "${{ env.TARGET_VERSION }}" --destination /tmp/stg-charts
            UPLOAD_FILE="/tmp/stg-charts/${{ env.APP }}-${{ env.TARGET_VERSION }}.tgz"
          else
            # Stg -> Prod: Direct bit-for-bit copy of immutable semver artifact
            UPLOAD_FILE="/tmp/charts/${{ env.APP }}-${{ env.TARGET_VERSION }}.tgz"
          fi

          TARGET_OCI="oci://${TARGET_OCI_BASE}"
          echo "==> Pushing promoted chart archive (${UPLOAD_FILE}) to target ECR: $TARGET_OCI..."
          helm push "$UPLOAD_FILE" "$TARGET_OCI"

      # ------------------------------------------------------------------------
      # Metadata Artifact Upload for Downstream Serialized GitOps Commit
      # ------------------------------------------------------------------------
      - name: Save Chart Metadata Artifact
        run: |
          mkdir -p /tmp/metadata
          echo "{\"app\": \"${{ env.APP }}\", \"version\": \"${{ env.TARGET_VERSION }}\"}" > "/tmp/metadata/chart-${{ env.APP }}.json"

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: chart-metadata-${{ env.APP }}
          path: /tmp/metadata/chart-${{ env.APP }}.json
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Phase 3: Serialized GitOps Discovery Release Commit
  # ----------------------------------------------------------------------------
  gitops-commit:
    name: Commit GitOps Tracking Release
    needs: [detect-and-matrix, package-or-promote]
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-and-matrix.outputs.env }}
    concurrency:
      group: git-commit-${{ needs.detect-and-matrix.outputs.env == 'dev' && 'dev' || format('{0}-helm', needs.detect-and-matrix.outputs.env) }}
      cancel-in-progress: false
    env:
      ENV: ${{ needs.detect-and-matrix.outputs.env }}
      TARGET_VERSION: ${{ needs.detect-and-matrix.outputs.target_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Chart Metadata Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          pattern: 'chart-metadata-*'
          path: /tmp/metadata-download
          merge-multiple: true

      - name: Configure Target Branch & Update Discovery Configs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ env.ENV }}" = "dev" ]; then
            TARGET_BRANCH="dev"
            git checkout dev
            git pull --rebase origin dev
          else
            TARGET_BRANCH="${{ env.ENV }}/helm"
            if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
              git checkout "$TARGET_BRANCH"
              git pull --rebase origin "$TARGET_BRANCH"
            else
              git checkout -b "$TARGET_BRANCH"
            fi
          fi

          # Iterate through downloaded metadata files and update config.json
          MODIFIED_FILES=()
          APPS=()
          for meta_file in /tmp/metadata-download/chart-*.json; do
            [ -f "$meta_file" ] || continue
            APP_NAME=$(jq -r '.app' "$meta_file")
            CHART_VER=$(jq -r '.version' "$meta_file")

            APPS+=("$APP_NAME")
            CONFIG_DIR="infra/k8s/argocd/${{ env.ENV }}/helm-${APP_NAME}"
            CONFIG_FILE="${CONFIG_DIR}/config.json"
            mkdir -p "$CONFIG_DIR"

            if [ ! -f "$CONFIG_FILE" ]; then
              echo "Creating initial config.json for ${APP_NAME} in ${{ env.ENV }}..."
              cat <<EOF > "$CONFIG_FILE"
          {
            "app": "${APP_NAME}",
            "chart_name": "${APP_NAME}",
            "chart_version": "${CHART_VER}"
          }
          EOF
            else
              echo "Updating chart_version to ${CHART_VER} in $CONFIG_FILE..."
              jq --arg v "$CHART_VER" '.chart_version = $v' "$CONFIG_FILE" > "${CONFIG_FILE}.tmp"
              mv "${CONFIG_FILE}.tmp" "$CONFIG_FILE"
            fi

            git add "$CONFIG_FILE"
            MODIFIED_FILES+=("$CONFIG_FILE")
          done

          if [ ${#MODIFIED_FILES[@]} -eq 0 ]; then
            echo "No chart metadata found to update."
            exit 0
          fi

          echo "Committing updated Helm discovery configs for branch: $TARGET_BRANCH..."
          git commit -m "release(helm): update charts [${APPS[*]}] to ${{ env.TARGET_VERSION }} [skip ci]" \
                     -m "Environment: ${{ env.ENV }}" \
                     -m "Target Version: ${{ env.TARGET_VERSION }}" \
                     -m "Commit SHA: ${{ needs.detect-and-matrix.outputs.commit_sha }}" \
                     -m "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "No changes to commit"

          git pull --rebase origin "$TARGET_BRANCH" || true
          git push origin HEAD:"$TARGET_BRANCH"
          echo "Successfully pushed release commit to $TARGET_BRANCH."
