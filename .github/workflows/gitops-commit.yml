# ==============================================================================
# GitOps Helm Value Commit Workflow
# ==============================================================================
# Purpose:
#   Updates Helm values files (`infra/k8s/helm/<service>/values.dev.yaml`) with
#   newly built image repository URLs and Short SHA image tags, then commits and
#   pushes back to Git to trigger ArgoCD auto-sync.
#
# Concurrency Mechanics:
#   Uses `concurrency.group: helm-gitops-commit` across ALL caller microservice workflows.
#   This guarantees that while Docker container builds run in parallel, all Git commits
#   and pushes are strictly serialized. This eliminates git ref lock contention and
#   avoids merge conflicts when multiple microservices build simultaneously.
# ==============================================================================

name: GitOps Helm Commit

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the application (e.g., api, worker)'
        required: true
        type: string
      helm_values_path:
        description: 'Path to the Helm values file to update'
        required: true
        type: string
      ecr_repo_url:
        description: 'Full ECR repository URL (without tag)'
        required: true
        type: string
      short_sha:
        description: 'Short git SHA'
        required: true
        type: string
      image_tag:
        description: 'final image tag'
        required: true
        type: string

# Serializes all Helm GitOps commits across every service workflow.
# Build + push steps in callers run fully in parallel — only this tiny
# commit step is queued, eliminating the stale-ref race condition.
concurrency:
  group: helm-gitops-commit
  cancel-in-progress: false

permissions:
  contents: write

jobs:   
  commit:
    name: Commit Updated Helm Values
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Pull Latest (rebase)
        run: git pull --rebase origin ${{ github.ref_name }}

      - name: Update Helm Chart Values
        run: |
          sed -i "s|repository: .*|repository: \"${{ inputs.ecr_repo_url }}\"|" ${{ inputs.helm_values_path }}
          sed -i "s|tag: .*|tag: \"${{ inputs.image_tag }}\"|" ${{ inputs.helm_values_path }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.helm_values_path }}
          git commit -m "Update ${{ inputs.app_name }} image to ${{ inputs.image_tag }} [skip ci]" \
                         -m "Triggered by: ${{ github.actor }}" \
                         -m "Original Commit: ${{ github.sha }}" \
                         -m "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "No changes to commit"
          git push origin HEAD

      - name: Summary
        run: |
          echo "ArgoCD will now sync ${{ inputs.app_name }} → ${{ inputs.ecr_repo_url }}:${{ inputs.image_tag }}"

