# ==============================================================================
# Kubernetes Infrastructure Deployment Workflow
# ==============================================================================
# Purpose:
#   Deploys and manages Kubernetes cluster resources (Helm charts for API/Worker,
#   ArgoCD applications, KEDA auto-scalers, AWS Load Balancer Controller, Secrets Store CSI)
#   using Terraform located in `infra/terraform/k8s`.
#
# Trigger Conditions:
#   - Push to `dev` branch with changes under `infra/terraform/k8s/**`.
#   - Manual `workflow_dispatch`.
#   - Reusable `workflow_call` (invoked automatically after `aws-deploy.yml` completes).
#
# Key Features & Operational Logic:
#   - Race Condition Avoidance: If both AWS and K8s Terraform files were updated in the
#     same commit, this workflow defers execution to `aws-deploy.yml` to ensure cluster readiness.
#   - Dynamic ALB Resolution: Polls the Kubernetes API Gateway until the AWS Load Balancer
#     Controller provisions the ALB address.
#   - CloudFront Origin Targeting: Performs a targeted `terraform apply` on AWS CloudFront
#     modules to point API route traffic directly to the newly resolved Gateway ALB DNS.
# ==============================================================================

name: Deploy K8s Infrastructure

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/terraform/k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      vpc_id:
        required: true
        type: string
      api_domain:
        required: true
        type: string
      acm_cert_arn:
        required: true
        type: string
      ssm_parameters_name:
        required: true
        type: string
      ssm_secrets_name:
        required: true
        type: string
      project_name:
        required: true
        type: string
      github_repository_url:
        required: true
        type: string
      target_revision_api:
        required: true
        type: string
      target_revision_worker:
        required: true
        type: string

# Prevent concurrent K8s infrastructure deployments for the target environment
concurrency:
  group: deploy-k8s-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: read

jobs:
  deploy-k8s:
    name: Provision K8s Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      
      - name: Set Environment Context
        id: context
        run: |
          if [ -n "${{ inputs.cluster_name }}" ]; then
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache AWS CLI + Kubectl
      # ------------------------------------------------------------------------
      - name: Install AWS CLI and kubectl for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            sudo /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          if ! command -v kubectl &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/kubectl ]; then
              echo "Downloading kubectl to local cache..."
              curl -sL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" -o /tmp/.act-tools-cache/kubectl
              chmod +x /tmp/.act-tools-cache/kubectl
            fi
            echo "Installing kubectl from local cache..."
            sudo cp /tmp/.act-tools-cache/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across all lock files)
      # ------------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e   # v4.0.1
        with:
          terraform_version: "v1.16.4"  
          terraform_wrapper: false

      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Format
        working-directory: infra/terraform/k8s
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Check for Concurrent AWS Changes (Defer if AWS infra is being updated)
      # ------------------------------------------------------------------------
      - name: Check if AWS was also modified
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d   # v4.0.3
        id: filter
        if: inputs.cluster_name == '' && github.event_name != 'workflow_dispatch'
        with:
          base: dev
          filters: |
            aws:
              - 'infra/terraform/aws/**'

      - name: Check AWS Infrastructure
        id: aws-check
        if: inputs.cluster_name == ''
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${{ steps.filter.outputs.aws }}" == "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "AWS infrastructure changes detected in the same commit. Deferring to aws-deploy workflow to avoid race conditions."
            exit 0
          fi
          
          terraform init
          # Use -json + jq so Terraform always emits valid JSON on stdout (never a warning box)
          TF_JSON=$(terraform output -json 2>/dev/null)
          CLUSTER_NAME=$(echo "$TF_JSON" | jq -r '.eks_cluster_name.value // empty')
          if [ -z "$CLUSTER_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "EKS cluster output missing in AWS state. Skipping K8s deploy."
            exit 0
          fi
          if ! aws eks describe-cluster --name "$CLUSTER_NAME" > /dev/null 2>&1; then
             echo "skip=true" >> $GITHUB_OUTPUT
             echo "EKS cluster $CLUSTER_NAME does not exist. Skipping K8s deploy."
             exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "VPC_ID=$(echo "$TF_JSON" | jq -r '.vpc_id.value // empty')" >> $GITHUB_ENV
          echo "API_DOMAIN=${{ inputs.api_domain || vars.TF_API_HOSTNAME }}" >> $GITHUB_ENV
          echo "ACM_CERT_ARN=$(echo "$TF_JSON" | jq -r '.acm_cert_arn.value // empty')" >> $GITHUB_ENV
          echo "SSM_PARAMETERS_NAME=$(echo "$TF_JSON" | jq -r '.ssm_parameters_name.value // empty')" >> $GITHUB_ENV
          echo "SSM_SECRETS_NAME=$(echo "$TF_JSON" | jq -r '.ssm_secrets_name.value // empty')" >> $GITHUB_ENV

      - name: Set Variables (Dispatch/Call Events)
        if: inputs.cluster_name != ''
        run: |
          echo "CLUSTER_NAME=${{ inputs.cluster_name }}" >> $GITHUB_ENV
          echo "VPC_ID=${{ inputs.vpc_id }}" >> $GITHUB_ENV
          echo "API_DOMAIN=${{ inputs.api_domain || vars.TF_API_HOSTNAME }}" >> $GITHUB_ENV
          echo "ACM_CERT_ARN=${{ inputs.acm_cert_arn }}" >> $GITHUB_ENV
          echo "SSM_PARAMETERS_NAME=${{ inputs.ssm_parameters_name }}" >> $GITHUB_ENV
          echo "SSM_SECRETS_NAME=${{ inputs.ssm_secrets_name }}" >> $GITHUB_ENV

      # ------------------------------------------------------------------------
      # Terraform Init & Apply for K8s Infrastructure Modules & Helm Releases
      # ------------------------------------------------------------------------
      - name: Terraform Init
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/k8s
        run: |
          terraform init 

      - name: Terraform Apply
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/k8s
        run: |
          terraform apply -auto-approve \
            -var="cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="vpc_id=${{ env.VPC_ID }}" \
            -var="api_domain=${{ env.API_DOMAIN }}" \
            -var="acm_cert_arn=${{ env.ACM_CERT_ARN }}" \
            -var="ssm_parameters_name=${{ env.SSM_PARAMETERS_NAME }}" \
            -var="ssm_secrets_name=${{ env.SSM_SECRETS_NAME }}" \
            -var="environment=${{ env.ENV }}" \
            -var="project_name=${{ vars.TF_PROJECT_NAME || inputs.project_name }}" \
            -var="github_repository_url=${{ inputs.github_repository_url || vars.TF_GITHUB_REPOSITORY_URL }}" \
            -var="targetRevision_api=${{ inputs.target_revision_api || vars.TF_TARGET_REVISION_API }}" \
            -var="targetRevision_worker=${{ inputs.target_revision_worker || vars.TF_TARGET_REVISION_WORKER }}" 

      # ------------------------------------------------------------------------
      # Update Kubeconfig & Poll for Gateway ALB DNS
      # ------------------------------------------------------------------------
      - name: Configure kubectl for EKS
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region us-east-1

      - name: Wait for Gateway ALB Address
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        id: alb-address
        env:
          GATEWAY_NAME: "${{ vars.TF_PROJECT_NAME }}-${{ env.ENV }}-api-gateway"
          TIMEOUT: "300"
          POLL_INTERVAL: "10"
        run: |
          echo "Waiting up to ${TIMEOUT}s for Gateway '${GATEWAY_NAME}' to receive an ALB address..."
          ALB_DNS=""
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            ALB_DNS=$(kubectl get gateway "${GATEWAY_NAME}" \
              --namespace default \
              --output jsonpath='{.status.addresses[0].value}' \
              2>/dev/null || true)

            if [ -n "${ALB_DNS}" ]; then
              echo "ALB DNS resolved: ${ALB_DNS}"
              break
            fi

            echo "  … not yet available (${ELAPSED}s elapsed). Retrying in ${POLL_INTERVAL}s."
            sleep "${POLL_INTERVAL}"
            ELAPSED=$(( ELAPSED + POLL_INTERVAL ))
          done

          if [ -z "${ALB_DNS}" ]; then
            echo "Timed out after ${TIMEOUT}s waiting for Gateway '${GATEWAY_NAME}' to get an ALB address."
            echo "Check AWS Load Balancer Controller logs:"
            echo "  kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller"
            exit 1
          fi

          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # Update AWS CloudFront Distribution API Origin to Point to Resolved ALB DNS
      # ------------------------------------------------------------------------
      - name: Update CloudFront API Origin (Targeted Apply)
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        env:
          TF_VAR_api_alb_dns_name:       ${{ steps.alb-address.outputs.alb_dns }}
          TF_VAR_project_name:           ${{ vars.TF_PROJECT_NAME }}
          TF_VAR_environment:            ${{ inputs.environment || 'dev' }}
          TF_VAR_vpc_cidr:               ${{ vars.TF_VPC_CIDR }}
          TF_VAR_db_name:                ${{ vars.TF_DB_NAME }}
          TF_VAR_db_username:            ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          TF_VAR_api_hostname:           ${{ vars.TF_API_HOSTNAME }}
          TF_VAR_admin_user_arns:        ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}
        run: |
          echo "Updating CloudFront API origin → ${{ steps.alb-address.outputs.alb_dns }}"

          if [ "${{ inputs.cluster_name }}" != "" ]; then
            terraform init
          fi

          terraform apply -auto-approve -input=false \
            -target="module.core.module.storage.aws_cloudfront_distribution.frontend" \
            -target="module.core.module.storage.aws_cloudfront_function.api_path_rewrite" \
            -target="module.core.module.storage.random_uuid.cf_origin_verify_token"

          echo "CloudFront API origin updated → ${{ steps.alb-address.outputs.alb_dns }}"

