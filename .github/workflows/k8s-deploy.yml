name: Deploy K8s Infrastructure

on:
  push:
    paths:
      - 'infra/terraform/k8s/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
      cluster_name:
        description: 'EKS Cluster Name'
        required: true
        default: ${{ vars.TF_EKS_CLUSTER_NAME }}
      vpc_id:
        description: 'VPC ID'
        required: true
      api_domain:
        description: 'API Domain'
        required: true
        default: ${{ vars.TF_API_HOSTNAME }}
      acm_cert_arn:
        description: 'ACM Certificate ARN'
        required: true
      ssm_parameters_name:
        description: 'SSM Parameters Name'
        required: true
        default: '/docintel/dev/parameters'
      ssm_secrets_name:
        description: 'SSM Secrets Name'
        required: true
        default: '/docintel/dev/secrets'
      project_name:
        description: 'Project name prefix'
        required: true
        default: ${{ vars.TF_PROJECT_NAME }}
      github_repository_url:
        description: 'GitHub repository URL (for ArgoCD ApplicationSet)'
        required: true
        default: ${{ vars.TF_GITHUB_REPOSITORY_URL }}
      target_revision:
        description: 'Git branch/tag ArgoCD should track'
        required: true
        default: ${{ vars.TF_TARGET_REVISION }}
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
      vpc_id:
        required: true
        type: string
      api_domain:
        required: true
        type: string
      acm_cert_arn:
        required: true
        type: string
      ssm_parameters_name:
        required: true
        type: string
      ssm_secrets_name:
        required: true
        type: string
      project_name:
        required: true
        type: string
      github_repository_url:
        required: true
        type: string
      target_revision:
        required: true
        type: string

concurrency:
  group: deploy-k8s-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read

jobs:
  deploy-k8s:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Terraform Format
        working-directory: infra/terraform/k8s
        run: terraform fmt -check -recursive

      - name: Terraform Init (Backend disabled for validation)
        working-directory: infra/terraform/k8s
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform/k8s
        run: terraform validate

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: us-east-1

      - name: Set Environment Context
        id: context
        run: |
          if [ -n "${{ inputs.cluster_name }}" ]; then
            echo "ENV=${{ inputs.environment }}" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: Check if AWS was also modified
        uses: dorny/paths-filter@v4
        id: filter
        if: inputs.cluster_name == ''
        with:
          # Change to the real base branch 
          base: dev
          filters: |
            aws:
              - 'infra/terraform/aws/**'

      - name: Check AWS Infrastructure (Push Event)
        id: aws-check
        if: inputs.cluster_name == ''
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        run: |
          if [ "${{ steps.filter.outputs.aws }}" == "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "AWS infrastructure changes detected in the same commit. Deferring to aws-deploy workflow to avoid race conditions."
            exit 0
          fi
          
          terraform init -upgrade 
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name || echo "")
          if [ -z "$CLUSTER_NAME" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "EKS cluster output missing in AWS state. Skipping K8s deploy."
            exit 0
          fi
          if ! aws eks describe-cluster --name "$CLUSTER_NAME" > /dev/null 2>&1; then
             echo "skip=true" >> $GITHUB_OUTPUT
             echo "EKS cluster $CLUSTER_NAME does not exist. Skipping K8s deploy."
             exit 0
          fi
          
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
          echo "VPC_ID=$(terraform output -raw vpc_id)" >> $GITHUB_ENV
          echo "API_DOMAIN=${{ inputs.api_domain || vars.TF_API_HOSTNAME }}" >> $GITHUB_ENV
          echo "ACM_CERT_ARN=$(terraform output -raw acm_cert_arn)" >> $GITHUB_ENV
          echo "SSM_PARAMETERS_NAME=$(terraform output -raw ssm_parameters_name)" >> $GITHUB_ENV
          echo "SSM_SECRETS_NAME=$(terraform output -raw ssm_secrets_name)" >> $GITHUB_ENV

      - name: Set Variables (Dispatch/Call Events)
        if: inputs.cluster_name != ''
        run: |
          echo "CLUSTER_NAME=${{ inputs.cluster_name }}" >> $GITHUB_ENV
          echo "VPC_ID=${{ inputs.vpc_id }}" >> $GITHUB_ENV
          echo "API_DOMAIN=${{ inputs.api_domain || vars.TF_API_HOSTNAME }}" >> $GITHUB_ENV
          echo "ACM_CERT_ARN=${{ inputs.acm_cert_arn }}" >> $GITHUB_ENV
          echo "SSM_PARAMETERS_NAME=${{ inputs.ssm_parameters_name }}" >> $GITHUB_ENV
          echo "SSM_SECRETS_NAME=${{ inputs.ssm_secrets_name }}" >> $GITHUB_ENV

      - name: Terraform Init
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/k8s
        run: |
          terraform init -upgrade 

      - name: Terraform Apply
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/k8s
        run: |
          terraform apply -auto-approve \
            -var="cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="vpc_id=${{ env.VPC_ID }}" \
            -var="api_domain=${{ env.API_DOMAIN }}" \
            -var="acm_cert_arn=${{ env.ACM_CERT_ARN }}" \
            -var="ssm_parameters_name=${{ env.SSM_PARAMETERS_NAME }}" \
            -var="ssm_secrets_name=${{ env.SSM_SECRETS_NAME }}" \
            -var="environment=${{ env.ENV }}" \
            -var="project_name=${{ inputs.project_name || vars.TF_PROJECT_NAME }}" \
            -var="github_repository_url=${{ inputs.github_repository_url || vars.TF_GITHUB_REPOSITORY_URL }}" \
            -var="targetRevision=${{ inputs.target_revision || vars.TF_TARGET_REVISION }}" \

      - name: Configure kubectl for EKS
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region us-east-1

      - name: Wait for Gateway ALB Address
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        id: alb-address
        env:
          GATEWAY_NAME: "${{ vars.TF_PROJECT_NAME }}-${{ env.ENV }}-api-gateway"
          TIMEOUT: "300"
          POLL_INTERVAL: "10"
        run: |
          echo "Waiting up to ${TIMEOUT}s for Gateway '${GATEWAY_NAME}' to receive an ALB address..."
          ALB_DNS=""
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            ALB_DNS=$(kubectl get gateway "${GATEWAY_NAME}" \
              --namespace default \
              --output jsonpath='{.status.addresses[0].value}' \
              2>/dev/null || true)

            if [ -n "${ALB_DNS}" ]; then
              echo "ALB DNS resolved: ${ALB_DNS}"
              break
            fi

            echo "  … not yet available (${ELAPSED}s elapsed). Retrying in ${POLL_INTERVAL}s."
            sleep "${POLL_INTERVAL}"
            ELAPSED=$(( ELAPSED + POLL_INTERVAL ))
          done

          if [ -z "${ALB_DNS}" ]; then
            echo "Timed out after ${TIMEOUT}s waiting for Gateway '${GATEWAY_NAME}' to get an ALB address."
            echo "Check AWS Load Balancer Controller logs:"
            echo "  kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller"
            exit 1
          fi

          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Update CloudFront API Origin (Targeted Apply)
        if: inputs.cluster_name != '' || steps.aws-check.outputs.skip == 'false'
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        env:
          TF_VAR_api_alb_dns_name:       ${{ steps.alb-address.outputs.alb_dns }}
          TF_VAR_project_name:           ${{ vars.TF_PROJECT_NAME }}
          TF_VAR_environment:            ${{ inputs.environment || 'dev' }}
          TF_VAR_vpc_cidr:               ${{ vars.TF_VPC_CIDR }}
          TF_VAR_db_name:                ${{ vars.TF_DB_NAME }}
          TF_VAR_db_username:            ${{ secrets.TF_DB_USERNAME }}
          TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          TF_VAR_api_hostname:           ${{ vars.TF_API_HOSTNAME }}
          TF_VAR_admin_user_arns:        ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}
        run: |
          echo "Updating CloudFront API origin → ${{ steps.alb-address.outputs.alb_dns }}"

          if [ "${{ inputs.cluster_name }}" != "" ]; then
            terraform init -upgrade
          fi

          terraform apply -auto-approve -input=false \
            -target="module.core.module.storage.aws_cloudfront_distribution.frontend" \
            -target="module.core.module.storage.aws_cloudfront_function.api_path_rewrite" \
            -target="module.core.module.storage.random_uuid.cf_origin_verify_token"

          echo "CloudFront API origin updated → ${{ steps.alb-address.outputs.alb_dns }}"
