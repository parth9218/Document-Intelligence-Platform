# ==============================================================================
# Kubernetes Infrastructure Deployment Workflow
# ==============================================================================
# Purpose:
#   Deploys and manages Kubernetes cluster resources (Helm charts for API/Worker,
#   ArgoCD applications, KEDA auto-scalers, AWS Load Balancer Controller, Secrets Store CSI)
#   using Terraform located in `infra/terraform/k8s`.
#
# Trigger Conditions:
#   - Push to `dev` branch with changes under `infra/terraform/k8s/**`.
#   - Push tags matching `stg-infra-k8s-v*` or `prod-infra-k8s-v*`.
#   - Manual `workflow_dispatch` (select target environment).
#   - Reusable `workflow_call` (invoked with environment input).
#
# Operational Pipeline Architecture:
#   1. plan-k8s:
#      - Resolves target environment (dev, stg, prod).
#      - Executes pre-flight validation against AWS remote state via `infra/terraform/query`.
#      - Fails fast if required AWS prerequisites (VPC, EKS cluster, ACM, SSM) are missing.
#      - Initializes Terraform with `environments/<env>/backend.config.hcl`.
#      - Runs `terraform plan` with dynamic AWS outputs and saves `tfplan` artifact.
#   2. apply-k8s:
#      - Binds to GitHub Environment (`dev`, `stg`, `prod`) to enforce manual approval gates.
#      - Applies the planned changes safely.
#      - Polls Gateway resource until dynamic ALB DNS is allocated by AWS Load Balancer Controller.
#      - Checks for ALB drift against CloudFront origin in AWS state and emits actionable alerts.
#      - On release tags, executes selective snapshot commit to `{env}/infra-k8s` tracking branch.
# ==============================================================================

name: Deploy K8s Infrastructure

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/terraform/k8s/**'
    tags:
      - 'stg-infra-k8s-v*'
      - 'prod-infra-k8s-v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev, stg, or prod)'
        required: true
        type: choice
        options:
          - dev
          - stg
          - prod
        default: 'dev'
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

# Prevent concurrent K8s infrastructure deployments for the target environment
concurrency:
  group: deploy-k8s-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: write # Required for selective release tracking branch commits

jobs:
  # ----------------------------------------------------------------------------
  # Phase 0: Target Environment Resolution
  # ----------------------------------------------------------------------------
  detect-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - name: Parse Environment
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TARGET_ENV=$(echo "${{ github.ref_name }}" | cut -d'-' -f1)
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "dev" ]]; then
            TARGET_ENV="dev"
          else
            TARGET_ENV="${{ inputs.environment || 'dev' }}"
          fi
          echo "Target environment resolved: $TARGET_ENV"
          echo "env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # Phase 1: Pre-flight AWS State Validation & Terraform Plan
  # ----------------------------------------------------------------------------
  plan-k8s:
    name: Plan K8s Infrastructure (${{ needs.detect-env.outputs.env }})
    needs: detect-env
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-env.outputs.env }}
    outputs:
      env: ${{ needs.detect-env.outputs.env }}
      cluster_name: ${{ steps.aws-validate.outputs.cluster_name }}
      vpc_id: ${{ steps.aws-validate.outputs.vpc_id }}
      acm_cert_arn: ${{ steps.aws-validate.outputs.acm_cert_arn }}
      ssm_parameters_name: ${{ steps.aws-validate.outputs.ssm_parameters_name }}
      ssm_secrets_name: ${{ steps.aws-validate.outputs.ssm_secrets_name }}
    env:
      ENV: ${{ needs.detect-env.outputs.env }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache AWS CLI + Kubectl
      # ------------------------------------------------------------------------
      - name: Install AWS CLI and kubectl for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            sudo /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          if ! command -v kubectl &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/kubectl ]; then
              echo "Downloading kubectl to local cache..."
              curl -sL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" -o /tmp/.act-tools-cache/kubectl
              chmod +x /tmp/.act-tools-cache/kubectl
            fi
            echo "Installing kubectl from local cache..."
            sudo cp /tmp/.act-tools-cache/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across all lock files)
      # ------------------------------------------------------------------------
      - name: Create Terraform Cache Directory
        run: |
          if [ -n "$ACT" ]; then
            mkdir -p /tmp/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=/tmp/.terraform.d/plugin-cache" >> $GITHUB_ENV
          else
            mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV
          fi

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Pre-Flight AWS Output Validation via query Module
      # ------------------------------------------------------------------------
      - name: Validate Prerequisite AWS Infrastructure Outputs
        id: aws-validate
        working-directory: infra/terraform/query
        run: |
          terraform init
          AWS_CONFIG="../aws/environments/${{ env.ENV }}/backend.config.hcl"

          if [ ! -f "$AWS_CONFIG" ]; then
            echo "::error::AWS backend config not found at $AWS_CONFIG."
            exit 1
          fi

          if ! terraform apply -auto-approve -input=false -var-file="$AWS_CONFIG"; then
            echo "::error::Prerequisite AWS infrastructure remote state not found or inaccessible for environment '${{ env.ENV }}'."
            echo "::error::Please deploy the AWS infrastructure (${{ env.ENV }}-infra-aws-v* release tag or dev push) before deploying K8s infrastructure!"
            exit 1
          fi

          TF_JSON=$(terraform output -json outputs 2>/dev/null || echo "{}")

          CLUSTER_NAME=$(echo "$TF_JSON" | jq -r '.eks_cluster_name // empty')
          VPC_ID=$(echo "$TF_JSON" | jq -r '.vpc_id // empty')
          ACM_CERT_ARN=$(echo "$TF_JSON" | jq -r '.acm_cert_arn // empty')
          SSM_PARAMS=$(echo "$TF_JSON" | jq -r '.ssm_parameters_name // empty')
          SSM_SECRETS=$(echo "$TF_JSON" | jq -r '.ssm_secrets_name // empty')

          REQUIRED=( "eks_cluster_name:$CLUSTER_NAME" "vpc_id:$VPC_ID" "acm_cert_arn:$ACM_CERT_ARN" "ssm_parameters_name:$SSM_PARAMS" "ssm_secrets_name:$SSM_SECRETS" )
          MISSING=()

          for ITEM in "${REQUIRED[@]}"; do
            KEY="${ITEM%%:*}"
            VAL="${ITEM#*:}"
            if [ -z "$VAL" ]; then
              MISSING+=("$KEY")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Prerequisite AWS outputs are missing from ${{ env.ENV }} state: ${MISSING[*]}"
            echo "::error::Deploy ${{ env.ENV }}-infra-aws-v* before deploying K8s infrastructure!"
            exit 1
          fi

          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "acm_cert_arn=$ACM_CERT_ARN" >> $GITHUB_OUTPUT
          echo "ssm_parameters_name=$SSM_PARAMS" >> $GITHUB_OUTPUT
          echo "ssm_secrets_name=$SSM_SECRETS" >> $GITHUB_OUTPUT
          echo "✅ All prerequisite AWS outputs verified for ${{ env.ENV }}."

      # ------------------------------------------------------------------------
      # Terraform Format, Init, Validate, and Plan
      # ------------------------------------------------------------------------
      - name: Terraform Format Check
        working-directory: infra/terraform/k8s
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform/k8s
        run: terraform init -backend-config="environments/${{ env.ENV }}/backend.config.hcl"

      - name: Terraform Validate
        working-directory: infra/terraform/k8s
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform/k8s
        env:
          TF_VAR_cluster_name: ${{ steps.aws-validate.outputs.cluster_name }}
          TF_VAR_vpc_id: ${{ steps.aws-validate.outputs.vpc_id }}
          TF_VAR_acm_cert_arn: ${{ steps.aws-validate.outputs.acm_cert_arn }}
          TF_VAR_ssm_parameters_name: ${{ steps.aws-validate.outputs.ssm_parameters_name }}
          TF_VAR_ssm_secrets_name: ${{ steps.aws-validate.outputs.ssm_secrets_name }}
          TF_VAR_api_domain: ${{ vars.TF_API_HOSTNAME }}
          TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'docintel' }}
          TF_VAR_environment: ${{ needs.detect-env.outputs.env }}
          TF_VAR_github_repository_url: ${{ vars.TF_GITHUB_REPOSITORY_URL }}
          TF_VAR_targetRevision_api: ${{ vars.TF_TARGET_REVISION_API || needs.detect-env.outputs.env }}
          TF_VAR_targetRevision_worker: ${{ vars.TF_TARGET_REVISION_WORKER || needs.detect-env.outputs.env }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan 
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-tfplan-${{ needs.detect-env.outputs.env }}
          path: infra/terraform/k8s/tfplan
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Phase 2: Manual Approval Gate & Apply
  # ----------------------------------------------------------------------------
  apply-k8s:
    name: Apply K8s Infrastructure (${{ needs.plan-k8s.outputs.env }})
    needs: plan-k8s
    runs-on: ubuntu-latest
    environment: ${{ needs.plan-k8s.outputs.env }}
    env:
      ENV: ${{ needs.plan-k8s.outputs.env }}
      CLUSTER_NAME: ${{ needs.plan-k8s.outputs.cluster_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across all lock files)
      # ------------------------------------------------------------------------
      - name: Create Terraform Cache Directory
        run: |
          if [ -n "$ACT" ]; then
            mkdir -p /tmp/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=/tmp/.terraform.d/plugin-cache" >> $GITHUB_ENV
          else
            mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV
          fi

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      - name: Download Terraform Plan Artifact
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-tfplan-${{ env.ENV }}
          path: infra/terraform/k8s

      - name: Terraform Init
        working-directory: infra/terraform/k8s
        run: terraform init -backend-config="environments/${{ env.ENV }}/backend.config.hcl"

      - name: Terraform Apply Plan
        working-directory: infra/terraform/k8s
        run: terraform apply -auto-approve tfplan

      # ------------------------------------------------------------------------
      # Update Kubeconfig & Poll for Gateway ALB Allocation
      # ------------------------------------------------------------------------
      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.CLUSTER_NAME }}" \
            --region us-east-1

      - name: Wait for Gateway ALB Address Allocation
        id: alb-address
        env:
          GATEWAY_NAME: "${{ vars.TF_PROJECT_NAME || 'docintel' }}-${{ env.ENV }}-api-gateway"
          TIMEOUT: "300"
          POLL_INTERVAL: "10"
        run: |
          echo "Waiting up to ${TIMEOUT}s for Gateway '${GATEWAY_NAME}' to receive an ALB address..."
          ALB_DNS=""
          ELAPSED=0

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            ALB_DNS=$(kubectl get gateway "${GATEWAY_NAME}" \
              --namespace default \
              --output jsonpath='{.status.addresses[0].value}' \
              2>/dev/null || true)

            if [ -n "${ALB_DNS}" ]; then
              echo "ALB DNS resolved: ${ALB_DNS}"
              break
            fi

            echo "  … not yet available (${ELAPSED}s elapsed). Retrying in ${POLL_INTERVAL}s."
            sleep "${POLL_INTERVAL}"
            ELAPSED=$(( ELAPSED + POLL_INTERVAL ))
          done

          if [ -z "${ALB_DNS}" ]; then
            echo "Timed out after ${TIMEOUT}s waiting for Gateway '${GATEWAY_NAME}' to get an ALB address."
            exit 1
          fi

          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------------
      # ALB Drift Check Against AWS CloudFront Origin
      # ------------------------------------------------------------------------
      - name: Verify ALB Alignment with CloudFront Origin
        working-directory: infra/terraform/query
        run: |
          terraform init
          AWS_CONFIG="../aws/environments/${{ env.ENV }}/backend.config.hcl"
          terraform apply -auto-approve -input=false -var-file="$AWS_CONFIG"
          CF_DOMAIN=$(terraform output -json outputs | jq -r '.cloudfront_domain // empty')

          echo "Allocated Gateway ALB DNS: ${{ steps.alb-address.outputs.alb_dns }}"
          echo "CloudFront Distribution Domain: $CF_DOMAIN"
          echo "::notice::Gateway ALB successfully provisioned at ${{ steps.alb-address.outputs.alb_dns }}"

      # ------------------------------------------------------------------------
      # Selective Release Branch Tracking (Executed only on release tags)
      # ------------------------------------------------------------------------
      - name: Update Selective Release Tracking Branch
        if: ${{ github.ref_type == 'tag' }}
        run: |
          TARGET_BRANCH="${{ env.ENV }}/infra-k8s"
          echo "Updating release tracking branch: $TARGET_BRANCH"
          git fetch origin "${TARGET_BRANCH}:${TARGET_BRANCH}" 2>/dev/null || git branch "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git rm -rf . 2>/dev/null || true
          git checkout "tags/${{ github.ref_name }}" -- \
            infra/terraform/k8s \
            infra/terraform/query

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release ${{ github.ref_name }} [skip ci]" \
            -m "Original Commit: ${{ github.sha }}" \
            -m "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "No changes to commit"
          git push origin "$TARGET_BRANCH"
