name: Deploy AWS Infrastructure (Prod)

on:
  workflow_dispatch:
    # Run this by selecting the rc/infra-aws-* tag from the "Use workflow from" dropdown

permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  deploy-aws-prod:
    if: startsWith(github.ref, 'refs/tags/rc/infra-aws-')
    runs-on: ubuntu-latest
    env:
      ENV: prod
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_environment: prod
      TF_VAR_vpc_cidr: ${{ vars.TF_PROD_VPC_CIDR || vars.TF_VPC_CIDR }}
      TF_VAR_db_name: ${{ vars.TF_DB_NAME }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
      TF_VAR_api_hostname: ${{ vars.TF_PROD_API_HOSTNAME || vars.TF_API_HOSTNAME }}
      TF_VAR_admin_user_arns: ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/infra/aws
          fetch-depth: 0

      - name: Scoped Checkout from RC Tag
        run: |
          git checkout ${{ github.ref_name }} -- infra/terraform/aws/environments infra/terraform/aws/modules

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.0"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: infra/terraform/aws/environments/prod
        run: terraform init -upgrade

      - name: Fetch K8s API ALB DNS
        working-directory: infra/terraform/k8s
        run: |
          terraform init -upgrade
          DNS=$(terraform output -json 2>/dev/null | jq -r '.api_alb_dns.value // empty')
          if [ -n "$DNS" ]; then
            echo "TF_VAR_api_alb_dns_name=$DNS" >> $GITHUB_ENV
          else
            echo "TF_VAR_api_alb_dns_name=dummy.alb.dns" >> $GITHUB_ENV
          fi

      - name: Terraform Plan
        working-directory: infra/terraform/aws/environments/prod
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Deploy AWS Prod from ${{ github.ref_name }}"
          issue-body: "Please review the terraform plan output in the workflow logs and approve or deny this deployment."
          exclude-workflow-initiator-as-approver: false

      - name: Terraform Apply
        working-directory: infra/terraform/aws/environments/prod
        run: terraform apply -auto-approve tfplan

      - name: Commit, Tag and Push
        run: |
          FINAL_TAG=$(echo "${{ github.ref_name }}" | sed 's/^rc\///')
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/terraform/aws/environments infra/terraform/aws/modules
          git commit -m "chore: deploy AWS infra $FINAL_TAG" || echo "No changes to commit"
          git tag "$FINAL_TAG"
          git push origin release/infra/aws
          git push origin "$FINAL_TAG"

      - name: Delete RC Tag
        run: |
          git push origin --delete ${{ github.ref_name }}
