# ==============================================================================
# Infrastructure Destruction Workflow
# ==============================================================================
# Purpose:
#   Tears down deployed cloud infrastructure in reverse dependency order:
#   1. `destroy-k8s`: Destroys Kubernetes workloads, Helm releases, and Gateway resources.
#   2. `destroy-aws`: Destroys underlying AWS resources (EKS, RDS, VPC, S3, SQS).
#
# Trigger Conditions:
#   - Manual `workflow_dispatch` only (safeguarded operation).
#   - Parameters:
#       * `environment`: dev or prod (default: dev).
#       * `destroy_aws`: boolean flag to confirm destroying root AWS infrastructure.
# ==============================================================================

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy (dev or prod)'
        required: true
        default: 'dev'
      destroy_aws:
        description: 'Destroy root AWS infrastructure'
        type: boolean
        required: true
        default: false

# Prevent concurrent destruction runs on the same environment
concurrency:
  group: destroy-infra-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Phase 1: Destroy Kubernetes Infrastructure & Workloads
  # ----------------------------------------------------------------------------
  destroy-k8s:
    name: Destroy K8s (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e   # v4.0.1
        with:
          terraform_version: "v1.16.4"  
          terraform_wrapper: false

      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Extract AWS Infrastructure Outputs
        id: aws-check
        working-directory: infra/terraform/aws/environments/${{ inputs.environment }}
        run: |
          terraform init
          TF_JSON=$(terraform output -json 2>/dev/null)
          
          CLUSTER_NAME=$(echo "$TF_JSON" | jq -r '.eks_cluster_name.value // empty')
          if [ -z "$CLUSTER_NAME" ]; then
            echo "EKS cluster output missing in AWS state. Assuming already destroyed or not present."
          else
            echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV
            echo "VPC_ID=$(echo "$TF_JSON" | jq -r '.vpc_id.value // empty')" >> $GITHUB_ENV
            echo "API_DOMAIN=${{ vars.TF_API_HOSTNAME }}" >> $GITHUB_ENV
            echo "ACM_CERT_ARN=$(echo "$TF_JSON" | jq -r '.acm_cert_arn.value // empty')" >> $GITHUB_ENV
            echo "SSM_PARAMETERS_NAME=$(echo "$TF_JSON" | jq -r '.ssm_parameters_name.value // empty')" >> $GITHUB_ENV
            echo "SSM_SECRETS_NAME=$(echo "$TF_JSON" | jq -r '.ssm_secrets_name.value // empty')" >> $GITHUB_ENV
          fi

      - name: Terraform Init (K8s)
        if: env.CLUSTER_NAME != ''
        working-directory: infra/terraform/k8s
        run: terraform init

      - name: Terraform Destroy (K8s)
        if: env.CLUSTER_NAME != ''
        working-directory: infra/terraform/k8s
        run: |
          terraform destroy -auto-approve \
            -var="cluster_name=${{ env.CLUSTER_NAME }}" \
            -var="vpc_id=${{ env.VPC_ID }}" \
            -var="api_domain=${{ env.API_DOMAIN }}" \
            -var="acm_cert_arn=${{ env.ACM_CERT_ARN }}" \
            -var="ssm_parameters_name=${{ env.SSM_PARAMETERS_NAME }}" \
            -var="ssm_secrets_name=${{ env.SSM_SECRETS_NAME }}" \
            -var="environment=${{ inputs.environment }}" \
            -var="project_name=${{ vars.TF_PROJECT_NAME }}" \
            -var="github_repository_url=${{ vars.TF_GITHUB_REPOSITORY_URL }}" \
            -var="targetRevision_api=${{ vars.TF_TARGET_REVISION_API }}" \
            -var="targetRevision_worker=${{ vars.TF_TARGET_REVISION_WORKER }}"

  # ----------------------------------------------------------------------------
  # Phase 2: Destroy Core AWS Infrastructure (Runs after K8s phase finishes)
  # ----------------------------------------------------------------------------
  destroy-aws:
    name: Destroy AWS (${{ inputs.environment || 'dev' }})
    needs: destroy-k8s
    if: inputs.destroy_aws == true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_db_name: ${{ vars.TF_DB_NAME }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
      TF_VAR_api_hostname: ${{ vars.TF_API_HOSTNAME }}
      TF_VAR_admin_user_arns: ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e   # v4.0.1
        with:
          terraform_version: "v1.16.4"  
          terraform_wrapper: false

      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init (AWS)
        working-directory: infra/terraform/aws/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Destroy (AWS)
        working-directory: infra/terraform/aws/environments/${{ inputs.environment }}
        run: terraform destroy -auto-approve

