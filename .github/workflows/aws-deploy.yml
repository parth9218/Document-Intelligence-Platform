# ==============================================================================
# AWS Infrastructure Deployment Workflow
# ==============================================================================
# Purpose:
#   Provisions and updates core AWS cloud infrastructure (VPC, RDS PostgreSQL,
#   S3 buckets, SQS queues, EKS cluster, CloudFront distribution, SSM parameters)
#   using Terraform located in `infra/terraform/aws`.
#
# Trigger Conditions:
#   - Push to `dev` branch with changes under `infra/terraform/aws/**`.
#   - Push tags matching `stg-infra-aws-v*` or `prod-infra-aws-v*`.
#   - Manual `workflow_dispatch` (triggers dev environment).
#
# Operational Pipeline Architecture:
#   1. plan-aws:
#      - Resolves target environment (dev via push/dispatch, stg/prod via tags).
#      - Dynamically queries K8s remote state via `infra/terraform/query` for Gateway ALB DNS.
#      - Initializes Terraform with `environments/<env>/backend.config.hcl`.
#      - Runs `terraform plan` and saves `tfplan` artifact.
#   2. apply-aws:
#      - Binds to GitHub Environment (`dev`, `stg`, `prod`) to enforce manual approval gates.
#      - Applies the planned changes safely.
#      - On release tags, executes selective snapshot commit to `{env}/infra-aws` tracking branch.
# ==============================================================================

name: Deploy AWS Infrastructure

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/terraform/aws/**'
    tags:
      - 'stg-infra-aws-v*'
      - 'prod-infra-aws-v*'
  workflow_dispatch:

# Prevent concurrent AWS infrastructure runs for the same target environment
concurrency:
  group: deploy-aws-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: write # Required for selective release tracking branch commits

jobs:
  # ----------------------------------------------------------------------------
  # Phase 0: Target Environment Resolution
  # ----------------------------------------------------------------------------
  detect-env:
    name: Resolve Target Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.resolve.outputs.env }}
    steps:
      - name: Parse Environment
        id: resolve
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TARGET_ENV=$(echo "${{ github.ref_name }}" | cut -d'-' -f1)
          elif [[ ("${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "dev") || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="dev"
          fi
          echo "Target environment resolved: $TARGET_ENV"
          echo "env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # Phase 1: Terraform Plan & State Validation
  # ----------------------------------------------------------------------------
  plan-aws:
    name: Plan AWS Infrastructure (${{ needs.detect-env.outputs.env }})
    needs: detect-env
    runs-on: ubuntu-latest
    environment: ${{ needs.detect-env.outputs.env }}
    outputs:
      env: ${{ needs.detect-env.outputs.env }}
      api_alb_dns: ${{ steps.resolve-alb.outputs.api_alb_dns }}
    env:
      ENV: ${{ needs.detect-env.outputs.env }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'docintel' }}
      TF_VAR_environment: ${{ needs.detect-env.outputs.env }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_db_name: ${{ vars.TF_DB_NAME }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
      TF_VAR_api_hostname: ${{ vars.TF_API_HOSTNAME }}
      TF_VAR_admin_user_arns: ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache AWS CLI + Kubectl
      # ------------------------------------------------------------------------
      - name: Install AWS CLI and kubectl for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            sudo /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          if ! command -v kubectl &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/kubectl ]; then
              echo "Downloading kubectl to local cache..."
              curl -sL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" -o /tmp/.act-tools-cache/kubectl
              chmod +x /tmp/.act-tools-cache/kubectl
            fi
            echo "Installing kubectl from local cache..."
            sudo cp /tmp/.act-tools-cache/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across all lock files)
      # ------------------------------------------------------------------------
      - name: Create Terraform Cache Directory
        run: |
          if [ -n "$ACT" ]; then
            mkdir -p /tmp/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=/tmp/.terraform.d/plugin-cache" >> $GITHUB_ENV
          else
            mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV
          fi

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      # ------------------------------------------------------------------------
      # Dynamic ALB Origin Resolution via Lightweight query Module
      # ------------------------------------------------------------------------
      - name: Query Existing K8s Gateway ALB DNS
        id: resolve-alb
        working-directory: infra/terraform/query
        run: |
          terraform init -lockfile=readonly
          K8S_CONFIG="../k8s/environments/${{ env.ENV }}/backend.config.hcl"
          ALB_DNS=""
          if [ -f "$K8S_CONFIG" ]; then
            terraform apply -auto-approve -input=false -var-file="$K8S_CONFIG" || true
            ALB_DNS=$(terraform output -json outputs 2>/dev/null | jq -r '.api_alb_dns // empty')
          fi

          if [ -n "$ALB_DNS" ]; then
            echo "Resolved active K8s ALB DNS: $ALB_DNS"
            echo "TF_VAR_api_alb_dns_name=$ALB_DNS" >> $GITHUB_ENV
            echo "api_alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          else
            echo "No active K8s ALB found in state. Falling back to placeholder."
            echo "TF_VAR_api_alb_dns_name=placeholder.elb.amazonaws.com" >> $GITHUB_ENV
            echo "api_alb_dns=placeholder.elb.amazonaws.com" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------------
      # Terraform Format, Init, Validate, and Plan
      # ------------------------------------------------------------------------
      - name: Terraform Format Check
        working-directory: infra/terraform/aws
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra/terraform/aws
        run: terraform init -lockfile=readonly -backend-config="environments/${{ env.ENV }}/backend.config.hcl"

      - name: Terraform Validate
        working-directory: infra/terraform/aws
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/terraform/aws
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan Artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-tfplan-${{ needs.detect-env.outputs.env }}
          path: infra/terraform/aws/tfplan
          retention-days: 1

  # ----------------------------------------------------------------------------
  # Phase 2: Manual Approval Gate & Apply
  # ----------------------------------------------------------------------------
  apply-aws:
    name: Apply AWS Infrastructure (${{ needs.plan-aws.outputs.env }})
    needs: plan-aws
    runs-on: ubuntu-latest
    environment: ${{ needs.plan-aws.outputs.env }}
    outputs:
      vpc_id: ${{ steps.tf-outputs.outputs.vpc_id }}
      eks_cluster_name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}
      acm_cert_arn: ${{ steps.tf-outputs.outputs.acm_cert_arn }}
      ssm_parameters_name: ${{ steps.tf-outputs.outputs.ssm_parameters_name }}
      ssm_secrets_name: ${{ steps.tf-outputs.outputs.ssm_secrets_name }}
    env:
      ENV: ${{ needs.plan-aws.outputs.env }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'docintel' }}
      TF_VAR_environment: ${{ needs.plan-aws.outputs.env }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_db_name: ${{ vars.TF_DB_NAME }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
      TF_VAR_api_hostname: ${{ vars.TF_API_HOSTNAME }}
      TF_VAR_admin_user_arns: ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}
      TF_VAR_api_alb_dns_name: ${{ needs.plan-aws.outputs.api_alb_dns }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across all lock files)
      # ------------------------------------------------------------------------
      - name: Create Terraform Cache Directory
        run: |
          if [ -n "$ACT" ]; then
            mkdir -p /tmp/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=/tmp/.terraform.d/plugin-cache" >> $GITHUB_ENV
          else
            mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
            echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV
          fi

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "v1.16.4"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      - name: Download Terraform Plan Artifact
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-tfplan-${{ env.ENV }}
          path: infra/terraform/aws

      - name: Terraform Init
        working-directory: infra/terraform/aws
        run: terraform init -lockfile=readonly -backend-config="environments/${{ env.ENV }}/backend.config.hcl"

      - name: Terraform Apply Plan
        working-directory: infra/terraform/aws
        run: terraform apply -auto-approve tfplan

      - name: Extract Terraform Outputs
        id: tf-outputs
        working-directory: infra/terraform/aws
        run: |
          TF_JSON=$(terraform output -json 2>/dev/null)
          echo "vpc_id=$(echo "$TF_JSON"              | jq -r '.vpc_id.value // empty')"              >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(echo "$TF_JSON"    | jq -r '.eks_cluster_name.value // empty')"    >> $GITHUB_OUTPUT
          echo "acm_cert_arn=$(echo "$TF_JSON"        | jq -r '.acm_cert_arn.value // empty')"        >> $GITHUB_OUTPUT
          echo "ssm_parameters_name=$(echo "$TF_JSON" | jq -r '.ssm_parameters_name.value // empty')" >> $GITHUB_OUTPUT
          echo "ssm_secrets_name=$(echo "$TF_JSON"    | jq -r '.ssm_secrets_name.value // empty')"    >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Deployment Step Summary & ALB Origin Alignment Guidance
      # ------------------------------------------------------------------------
      - name: Emit Deployment Summary
        if: always()
        run: |
          ALB_DNS="${{ needs.plan-aws.outputs.api_alb_dns }}"
          
          echo "## ☁️ AWS Infrastructure Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "### Status: ✅ Success" >> $GITHUB_STEP_SUMMARY
            if [ "$ALB_DNS" = "placeholder.elb.amazonaws.com" ] || [ -z "$ALB_DNS" ]; then
              echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
              echo "> **Action Required:** Active Gateway ALB DNS was not found in K8s remote state (placeholder DNS was used)." >> $GITHUB_STEP_SUMMARY
              echo "> Once Kubernetes infrastructure (\`k8s-deploy.yml\`) is deployed and the Gateway ALB DNS is generated, you **must re-run this AWS Infrastructure workflow** (\`aws-deploy.yml\`) to update the CloudFront distribution origin target." >> $GITHUB_STEP_SUMMARY
            else
              echo "> [!CAUTION]" >> $GITHUB_STEP_SUMMARY
              echo "> **Word of Caution:** CloudFront origin is currently configured with Gateway ALB DNS: \`${ALB_DNS}\`." >> $GITHUB_STEP_SUMMARY
              echo "> Anytime the Gateway ALB DNS is modified or re-created by the K8s stack, you **must re-run this AWS Infrastructure workflow** (\`aws-deploy.yml\`) to update the CloudFront distribution origin target." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### Status: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------------
      # Selective Release Branch Tracking (Executed only on release tags)
      # ------------------------------------------------------------------------
      - name: Update Selective Release Tracking Branch
        if: ${{ github.ref_type == 'tag' }}
        run: |
          TARGET_BRANCH="${{ env.ENV }}/infra-aws"
          echo "Updating release tracking branch: $TARGET_BRANCH"
          git restore . 
          git clean -fdx
          git fetch origin "${TARGET_BRANCH}:${TARGET_BRANCH}" 2>/dev/null || git branch "$TARGET_BRANCH"
          git checkout "$TARGET_BRANCH"
          git rm -rf . 2>/dev/null || true
          git checkout "tags/${{ github.ref_name }}" -- \
            infra/terraform/aws \
            infra/terraform/query

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Release ${{ github.ref_name }} [skip ci]" \
            -m "Original Commit: ${{ github.sha }}" \
            -m "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "No changes to commit"
          git push origin "$TARGET_BRANCH"
