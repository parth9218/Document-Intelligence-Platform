# ==============================================================================
# AWS Infrastructure Deployment Workflow
# ==============================================================================
# Purpose:
#   Provisions and updates core AWS cloud infrastructure (VPC, RDS PostgreSQL,
#   S3 buckets, SQS queues, EKS cluster, CloudFront distribution, SSM parameters)
#   using Terraform located in `infra/terraform/aws/environments/<env>`.
#
# Trigger Conditions:
#   - Push to `dev` branch with changes under `infra/terraform/aws/**` (excluding prod).
#   - Manual `workflow_dispatch` (allows selecting target environment and optional K8s deployment trigger).
#
# Key Features & Operational Logic:
#   - Local Testing Parity: Employs local binary caching under `env.ACT` for local `act` runner execution.
#   - Unified Plugin Cache: Restores and caches all Terraform provider binaries using a single unified key
#     hashed from all lock files across `infra/terraform/**/.terraform.lock.hcl`.
#   - Output Propagation: Emits key infrastructure outputs (VPC ID, EKS Cluster Name, ACM Cert ARN, SSM Names)
#     which can be passed directly to downstream workflow calls (`k8s-deploy.yml`).
# ==============================================================================

name: Deploy AWS Infrastructure

on:
  push:
    paths:
      - 'infra/terraform/aws/**'
      # Do not trigger dev deployment if changes are exclusively in the prod environment folder
      - '!infra/terraform/aws/environments/prod/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or prod)'
        required: true
        default: 'dev'
      trigger_k8s:
        description: 'Whether to trigger the K8s workflow (Set it to false for initial AWS infrastructure deployment)'
        required: true
        type: boolean
        default: false

# Prevent concurrent AWS infrastructure runs for the same target environment
concurrency:
  group: deploy-aws-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write # Required for AWS OIDC role assumption
  contents: read

jobs:
  deploy-aws:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    outputs:
      vpc_id: ${{ steps.tf-outputs.outputs.vpc_id }}
      eks_cluster_name: ${{ steps.tf-outputs.outputs.eks_cluster_name }}
      acm_cert_arn: ${{ steps.tf-outputs.outputs.acm_cert_arn }}
      ssm_parameters_name: ${{ steps.tf-outputs.outputs.ssm_parameters_name }}
      ssm_secrets_name: ${{ steps.tf-outputs.outputs.ssm_secrets_name }}
    env:
      ENV: ${{ inputs.environment || 'dev' }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_environment: ${{ inputs.environment || 'dev' }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR }}
      TF_VAR_db_name: ${{ vars.TF_DB_NAME }}
      TF_VAR_db_username: ${{ secrets.TF_DB_USERNAME }}
      TF_VAR_github_actions_ci_role: ${{ vars.TF_VAR_GITHUB_ACTIONS_CI_ROLE }}
      TF_VAR_api_hostname: ${{ vars.TF_API_HOSTNAME }}
      TF_VAR_admin_user_arns: ${{ vars.TF_ADMIN_USER_ARNS || '[]' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      # ------------------------------------------------------------------------
      # Local Execution (ACT) Setup: Download & Cache AWS CLI + Kubectl
      # ------------------------------------------------------------------------
      - name: Install AWS CLI and kubectl for ACT
        if: ${{ env.ACT }}
        run: |
          mkdir -p /tmp/.act-tools-cache
          if ! command -v aws &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/awscliv2.zip ]; then
              echo "Downloading AWS CLI to local cache..."
              curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/.act-tools-cache/awscliv2.zip
            fi
            echo "Installing AWS CLI from local cache..."
            unzip -q /tmp/.act-tools-cache/awscliv2.zip -d /tmp/aws-tmp
            sudo /tmp/aws-tmp/aws/install --update
            rm -rf /tmp/aws-tmp
          fi
          if ! command -v kubectl &> /dev/null; then
            if [ ! -f /tmp/.act-tools-cache/kubectl ]; then
              echo "Downloading kubectl to local cache..."
              curl -sL "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl" -o /tmp/.act-tools-cache/kubectl
              chmod +x /tmp/.act-tools-cache/kubectl
            fi
            echo "Installing kubectl from local cache..."
            sudo cp /tmp/.act-tools-cache/kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
          fi

      # ------------------------------------------------------------------------
      # Terraform Plugin Caching (Unified across AWS and K8s provider locks)
      # ------------------------------------------------------------------------
      - name: Create Terraform Cache Directory
        run: |
          mkdir -p ${{ runner.temp }}/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=${{ runner.temp }}/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Use terraform cache
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      # ------------------------------------------------------------------------
      # Terraform Environment Setup & Formatting Checks
      # ------------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e    # v4.0.1
        with:
          terraform_version: "v1.16.4"  
          terraform_wrapper: false

      - name: Terraform Format
        working-directory: infra/terraform/aws
        run: terraform fmt -check -recursive

      - name: Configure AWS Credentials
        if: ${{ !env.ACT }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd   # v6.3.0
        with:
          role-to-assume: ${{ env.TF_VAR_github_actions_ci_role }}
          aws-region: ${{ env.AWS_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        run: terraform validate

      # ------------------------------------------------------------------------
      # Read existing K8s state to retrieve API Gateway ALB DNS (if present)
      # ------------------------------------------------------------------------
      - name: Fetch K8s API ALB DNS
        working-directory: infra/terraform/k8s
        run: |
          terraform init
          # Use -json so Terraform always emits valid JSON (never a warning box on stdout).
          # jq returns "null" as a plain string when the key is absent.
          DNS=$(terraform output -json 2>/dev/null | jq -r '.api_alb_dns.value // empty')
          if [ -n "$DNS" ]; then
            echo "TF_VAR_api_alb_dns_name=$DNS" >> $GITHUB_ENV
          else
            echo "TF_VAR_api_alb_dns_name=dummy.alb.dns" >> $GITHUB_ENV
          fi

      # ------------------------------------------------------------------------
      # Apply AWS Terraform Infrastructure
      # ------------------------------------------------------------------------
      - name: Terraform Apply
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        env:
          TF_LOG: ${{ env.TF_LOG }}
        run: terraform apply -auto-approve -input=false

      # ------------------------------------------------------------------------
      # Export Infrastructure Variables for Downstream Steps/Workflows
      # ------------------------------------------------------------------------
      - name: Extract Terraform Outputs
        id: tf-outputs
        working-directory: infra/terraform/aws/environments/${{ env.ENV }}
        run: |
          # Use -json + jq so Terraform always emits valid JSON on stdout (never a warning box)
          TF_JSON=$(terraform output -json 2>/dev/null)
          echo "vpc_id=$(echo "$TF_JSON"              | jq -r '.vpc_id.value // empty')"              >> $GITHUB_OUTPUT
          echo "eks_cluster_name=$(echo "$TF_JSON"    | jq -r '.eks_cluster_name.value // empty')"    >> $GITHUB_OUTPUT
          echo "acm_cert_arn=$(echo "$TF_JSON"        | jq -r '.acm_cert_arn.value // empty')"        >> $GITHUB_OUTPUT
          echo "ssm_parameters_name=$(echo "$TF_JSON" | jq -r '.ssm_parameters_name.value // empty')" >> $GITHUB_OUTPUT
          echo "ssm_secrets_name=$(echo "$TF_JSON"    | jq -r '.ssm_secrets_name.value // empty')"    >> $GITHUB_OUTPUT

  # ----------------------------------------------------------------------------
  # Downstream K8s Workflow Triggering (Optional)
  # ----------------------------------------------------------------------------
  trigger-k8s:
    name: Trigger Kubernetes Deployment
    needs: deploy-aws
    if: inputs.trigger_k8s == true
    # Trigger the reusable k8s workflow, passing outputs from AWS as inputs
    uses: ./.github/workflows/k8s-deploy.yml
    with:
      environment:            ${{ inputs.environment || 'dev' }}
      cluster_name:           ${{ needs.deploy-aws.outputs.eks_cluster_name }}
      vpc_id:                 ${{ needs.deploy-aws.outputs.vpc_id }}
      api_domain:             ${{ vars.TF_API_HOSTNAME }}
      acm_cert_arn:           ${{ needs.deploy-aws.outputs.acm_cert_arn }}
      ssm_parameters_name:    ${{ needs.deploy-aws.outputs.ssm_parameters_name }}
      ssm_secrets_name:       ${{ needs.deploy-aws.outputs.ssm_secrets_name }}
      project_name:           ${{ vars.TF_PROJECT_NAME }}
      github_repository_url:  ${{ vars.TF_GITHUB_REPOSITORY_URL }}
      target_revision_api:    ${{ vars.TF_TARGET_REVISION_API }}
      target_revision_worker: ${{ vars.TF_TARGET_REVISION_WORKER }}
    secrets: inherit

